function startQuiz(subject, startFrom) {
  const qs = QUESTIONS[subject];
  if (!qs || qs.length === 0) return;
  const isWriting = subject === 'writing';
  const isTranslation = subject === 'english';

  if (startFrom !== undefined) {
    // Single question mode
    quizState = {
      subject,
      questions: [qs[startFrom]],
      currentIndex: 0,
      answers: {},
      startTime: Date.now(),
      mode: 'single',
      timeLimit: null
    };
  } else if (isWriting) {
    quizState = {
      subject,
      questions: [...qs],
      currentIndex: 0,
      answers: {},
      startTime: Date.now(),
      mode: 'writing',
      timeLimit: null
    };
  } else {
    // All questions, shuffled
    const shuffled = [...qs].sort(() => Math.random() - 0.5);
    quizState = {
      subject,
      questions: shuffled,
      currentIndex: 0,
      answers: {},
      startTime: Date.now(),
      mode: 'all',
      timeLimit: null
    };
  }
  currentPage = 'quiz';
  render();
}

function startExam() {
  // Collect questions from all subjects
  let allQs = [];
  for (let [key, qs] of Object.entries(QUESTIONS)) {
    if (key === 'writing') continue; // Skip writing in exam
    allQs.push(...qs.map(q => ({...q, subject: key})));
  }
  allQs = allQs.sort(() => Math.random() - 0.5);

  quizState = {
    subject: 'exam',
    questions: allQs,
    currentIndex: 0,
    answers: {},
    startTime: Date.now(),
    mode: 'exam',
    timeLimit: 180 * 60 * 1000 // 3 hours
  };
  currentPage = 'quiz';
  render();
}

function renderQuiz() {
  if (!quizState) { navigate('home'); return; }
  const qs = quizState.questions;
  const idx = quizState.currentIndex;
  const q = qs[idx];
  const sub = SUBJECTS[q.subject || quizState.subject];
  const answered = quizState.answers[idx] !== undefined;
  const userAns = quizState.answers[idx];
  const isWriting = q.type === 'effectiveness' || q.type === 'essay';
  const isTranslate = q.type === 'translate';
  const noOptions = isWriting || isTranslate;

  // Timer
  let timerHtml = '';
  if (quizState.mode === 'exam') {
    const elapsed = Date.now() - quizState.startTime;
    const remaining = Math.max(0, quizState.timeLimit - elapsed);
    const mins = Math.floor(remaining / 60000);
    const secs = Math.floor((remaining % 60000) / 1000);
    timerHtml = `<div class="quiz-timer">⏱ ${mins}:${secs.toString().padStart(2,'0')}</div>`;
  } else {
    const elapsed = Date.now() - quizState.startTime;
    const mins = Math.floor(elapsed / 60000);
    const secs = Math.floor((elapsed % 60000) / 1000);
    timerHtml = `<div class="quiz-timer">⏱ ${mins}:${secs.toString().padStart(2,'0')}</div>`;
  }

  // Progress
  const progressHtml = `<div class="quiz-progress">${idx+1} / ${qs.length}</div>`;

  // Options
  let optionsHtml = '';
  if (!noOptions && q.opts && q.opts.length > 0) {
    const labels = ['A','B','C','D','E'];
    optionsHtml = '<div class="option-list">';
    q.opts.forEach((opt, i) => {
      let cls = 'option-item';
      if (answered && i === q.ans) cls += ' correct';
      else if (answered && userAns === i) cls += ' wrong';
      else if (!answered) cls += '';
      optionsHtml += `
        <div class="${cls}" onclick="${answered?'':'selectAnswer('+i+')'}">
          <span class="option-label">${labels[i]}.</span>
          <span>${opt}</span>
        </div>
      `;
    });
    optionsHtml += '</div>';
  }

  // Explanation (show after answering)
  let expHtml = '';
  if (answered || noOptions) {
    if (isWriting) {
      expHtml = `
        <div class="explanation" style="margin-top:12px">
          <strong>📝 逻辑缺陷分析：</strong><br>${q.exp.replace(/\n/g,'<br>')}
        </div>
        ${q.sampleAnswer ? `
        <div class="sample-answer" style="margin-top:12px">
          <div class="tag">✅ 参考范文</div>
          <div style="font-size:13px;line-height:1.8;color:var(--text2)">${q.sampleAnswer.replace(/\n/g,'<br>')}</div>
        </div>` : ''}
      `;
    } else if (isTranslate) {
      expHtml = `
        <div class="explanation" style="margin-top:12px">
          <strong>📖 参考翻译与解析：</strong><br>${q.exp.replace(/\n/g,'<br>')}
        </div>
      `;
    } else {
      const labels = ['A','B','C','D','E'];
      const correctText = typeof q.ans === 'number' ? labels[q.ans] : q.ans;
      expHtml = `
        <div class="explanation" style="margin-top:12px">
          <strong>✅ 正确答案：${correctText}</strong><br><br>${q.exp}
        </div>
      `;
    }
  }

  // For writing/translate, show answer button
  let actionBtn = '';
  if (noOptions && !answered) {
    actionBtn = `<button class="btn btn-primary btn-block" onclick="showWritingAnswer()" style="margin-top:12px">查看答案与解析</button>`;
  }

  // Navigation
  let navHtml = '';
  if (answered || noOptions) {
    if (idx < qs.length - 1) {
      navHtml = `<button class="btn btn-primary btn-block" onclick="nextQuestion()" style="margin-top:12px">下一题 →</button>`;
    } else {
      navHtml = `<button class="btn btn-accent btn-block" onclick="finishQuiz()" style="margin-top:12px">完成练习 🎉</button>`;
    }
  }

  const subjectLabel = q.subject ? SUBJECTS[q.subject].icon + ' ' + SUBJECTS[q.subject].name : (sub ? sub.icon + ' ' + sub.name : '');

  app.innerHTML = `
    <div class="quiz-header">
      <button class="btn btn-sm btn-secondary" onclick="navigate('home')">← 退出</button>
      ${timerHtml}
      ${progressHtml}
    </div>
    ${subjectLabel ? `<div style="font-size:12px;color:var(--text2);margin-bottom:8px">${subjectLabel} · ${q.diff}${q.src ? ' · 📚 '+q.src : ''}</div>` : ''}
    <div class="question-card fade-in">
      <div class="question-num">第 ${idx+1} 题${q.type==='judge'?' · 条件充分性判断':''}</div>
      <div class="question-text">${q.q.replace(/\n/g,'<br>')}</div>
      ${optionsHtml}
      ${expHtml}
      ${actionBtn}
      ${navHtml}
    </div>
  `;

  // Auto-update timer for exam mode (only update timer text, no full re-render)
  if (quizState.mode === 'exam') {
    clearInterval(window._examTimerInterval);
    window._examTimerInterval = setInterval(() => {
      if (currentPage !== 'quiz' || !quizState || quizState.mode !== 'exam') {
        clearInterval(window._examTimerInterval);
        return;
      }
      const elapsed = Date.now() - quizState.startTime;
      const remaining = Math.max(0, quizState.timeLimit - elapsed);
      const mins = Math.floor(remaining / 60000);
      const secs = Math.floor((remaining % 60000) / 1000);
      const timerEl = document.querySelector('.quiz-timer');
      if (timerEl) {
        timerEl.textContent = `⏱ ${mins}:${secs.toString().padStart(2,'0')}`;
      } else {
        clearInterval(window._examTimerInterval);
      }
    }, 1000);
  }
}

function selectAnswer(idx) {
  if (quizState.answers[quizState.currentIndex] !== undefined) return;
  quizState.answers[quizState.currentIndex] = idx;

  const q = quizState.questions[quizState.currentIndex];
  const uid = state.currentUser;
  const u = state.users[uid];

  u.totalQuestions++;
  const isCorrect = idx === q.ans;
  incSubjectStat(uid, getQuestionSubject(q.id), isCorrect);
  if (isCorrect) {
    u.correctCount++;
    // Auto-remove from wrong book if answered correctly
    if (u.wrongBook.includes(q.id)) {
      u.wrongBook = u.wrongBook.filter(id => id !== q.id);
    }
  } else {
    if (!u.wrongBook.includes(q.id)) u.wrongBook.push(q.id);
  }

  // Check streak
  checkStreak(uid);

  saveState();

  // Partial DOM update to avoid flash/flicker
  const isWriting = q.type === 'effectiveness' || q.type === 'essay';
  const isTranslate = q.type === 'translate';
  const noOptions = isWriting || isTranslate;

  if (!noOptions && q.opts && q.opts.length > 0) {
    const labels = ['A','B','C','D','E'];
    const optionEls = document.querySelectorAll('.option-item');
    optionEls.forEach((el, i) => {
      el.onclick = null; // disable click
      if (i === q.ans) el.classList.add('correct');
      else if (i === idx) el.classList.add('wrong');
    });
  }

  // Insert explanation and navigation below options
  const card = document.querySelector('.question-card');
  if (card) {
    // Remove any existing explanation/nav
    card.querySelectorAll('.explanation, .sample-answer, .btn-block').forEach(el => el.remove());

    let expHtml = '';
    if (isWriting) {
      expHtml = `<div class="explanation" style="margin-top:12px"><strong>📝 逻辑缺陷分析：</strong><br>${q.exp.replace(/\n/g,'<br>')}</div>${q.sampleAnswer ? `<div class="sample-answer" style="margin-top:12px"><div class="tag">✅ 参考范文</div><div style="font-size:13px;line-height:1.8;color:var(--text2)">${q.sampleAnswer.replace(/\n/g,'<br>')}</div></div>` : ''}`;
    } else if (isTranslate) {
      expHtml = `<div class="explanation" style="margin-top:12px"><strong>📖 参考翻译与解析：</strong><br>${q.exp.replace(/\n/g,'<br>')}</div>`;
    } else {
      const labels2 = ['A','B','C','D','E'];
      const correctText = typeof q.ans === 'number' ? labels2[q.ans] : q.ans;
      expHtml = `<div class="explanation" style="margin-top:12px"><strong>✅ 正确答案：${correctText}</strong><br><br>${q.exp}</div>`;
    }
    card.insertAdjacentHTML('beforeend', expHtml);

    const qs = quizState.questions;
    const curIdx = quizState.currentIndex;
    if (curIdx < qs.length - 1) {
      card.insertAdjacentHTML('beforeend', `<button class="btn btn-primary btn-block" onclick="nextQuestion()" style="margin-top:12px">下一题 →</button>`);
    } else {
      card.insertAdjacentHTML('beforeend', `<button class="btn btn-accent btn-block" onclick="finishQuiz()" style="margin-top:12px">完成练习 🎉</button>`);
    }
  }
}

function showWritingAnswer() {
  quizState.answers[quizState.currentIndex] = 'viewed';

  const u = state.users[uid];
  u.totalQuestions++;

    } else if (q.type === 'translate') {
      expHtml = `<div class="explanation" style="margin-top:12px"><strong>📖 参考翻译与解析：</strong><br>${q.exp.replace(/\n/g,'<br>')}</div>`;
    }

    const curIdx = quizState.currentIndex;
    if (curIdx < qs.length - 1) {
      card.insertAdjacentHTML('beforeend', `<button class="btn btn-primary btn-block" onclick="nextQuestion()" style="margin-top:12px">下一题 →</button>`);
    } else {
      card.insertAdjacentHTML('beforeend', `<button class="btn btn-accent btn-block" onclick="finishQuiz()" style="margin-top:12px">完成练习 🎉</button>`);

function nextQuestion() {
  quizState.currentIndex++;
  render();
  window.scrollTo(0, 0);
}

function finishQuiz() {
  clearInterval(window._examTimerInterval);
  const uid = state.currentUser;
  const u = state.users[uid];
  const total = quizState.questions.length;
  const answered = Object.keys(quizState.answers).length;
  let correct = 0;
  quizState.questions.forEach((q, i) => {
    if (q.opts && q.opts.length > 0) {
      if (quizState.answers[i] === q.ans) correct++;
    }
  });

  const totalWithOpts = quizState.questions.filter(q=>q.opts&&q.opts.length>0).length;
  const time = Date.now() - quizState.startTime;
  const mins = Math.floor(time / 60000);
  const secs = Math.floor((time % 60000) / 1000);
  const accuracy = totalWithOpts > 0 ? Math.round(correct / totalWithOpts * 100) : 100;
  const wrongCount = totalWithOpts - correct;

  quizState = null;
  currentPage = 'home';

  // Show result modal
  const modal = document.getElementById('modalOverlay');
  modal.classList.add('show');
  modal.innerHTML = `
    <div class="modal fade-in">
      <h3>🎉 练习完成！</h3>
      <div class="stat-row">
        <div class="stat-box"><div class="val" style="color:var(--green)">${correct}</div><div class="label">答对</div></div>
        <div class="stat-box"><div class="val" style="color:var(--primary)">${wrongCount}</div><div class="label">答错</div></div>
      </div>
      <div class="stat-row">
        <div class="stat-box"><div class="val">${accuracy}%</div><div class="label">正确率</div></div>
        <div class="stat-box"><div class="val">${mins}:${secs.toString().padStart(2,'0')}</div><div class="label">用时</div></div>
      </div>
      <button class="btn btn-primary btn-block" onclick="document.getElementById('modalOverlay').classList.remove('show');render()" style="margin-top:16px">返回首页</button>
    </div>
  `;

  render();
}

function nudgePartner() {
  const otherId = state.currentUser === 'user1' ? 'user2' : 'user1';
  const other = state.users[otherId];
  if (other.studyDays[today()]) {
    showToast(`${esc(other.name)}今天已经学习啦，你也要加油哦！💪`);
  } else {
    showToast(`已发送催学提醒给${esc(other.name)}！🫵 快去学习！`);
  }
}

function startPK(mode) {
  const count = mode === 'quick' ? 5 : 10;
  let allQs = [];
  for (let [key, qs] of Object.entries(QUESTIONS)) {
    if (key === 'writing') continue;
    allQs.push(...qs.filter(q => q.opts && q.opts.length > 0).map(q => ({...q, subject: key})));
  }
  const shuffled = allQs.sort(() => Math.random() - 0.5).slice(0, count);

  pkState = {
    mode,
    questions: shuffled,
    player1Answers: {},
    player2Answers: {},
    currentPlayer: 'user1',
    currentIndex: 0,
    phase: 'playing' // playing, player2, result
  };

  renderPKQuiz();
}

function renderPKQuiz() {
  if (!pkState) return;
  const ps = pkState;
  const idx = ps.currentIndex;
  const q = ps.questions[idx];
  const isP2 = ps.phase === 'player2';
  const currentAnswers = isP2 ? ps.player2Answers : ps.player1Answers;
  const answered = currentAnswers[idx] !== undefined;
  const userAns = currentAnswers[idx];
  const pName = isP2 ? esc(state.users.user2.name) : esc(state.users.user1.name);

  const labels = ['A','B','C','D','E'];
  let optionsHtml = '';
  if (q.opts && q.opts.length > 0) {
    optionsHtml = '<div class="option-list">';
    q.opts.forEach((opt, i) => {
      let cls = 'option-item';
      if (answered && i === q.ans) cls += ' correct';
      else if (answered && userAns === i) cls += ' wrong';
      optionsHtml += `
        <div class="${cls}" onclick="${answered?'':'pkSelectAnswer('+i+')'}">
          <span class="option-label">${labels[i]}.</span>
          <span>${opt}</span>
        </div>
      `;
    });
    optionsHtml += '</div>';
  }

  let expHtml = '';
  if (answered) {
    expHtml = `<div class="explanation" style="margin-top:12px"><strong>✅ 答案：${labels[q.ans]}</strong><br>${q.exp}</div>`;
  }

  let navHtml = '';
  if (answered) {
    if (idx < ps.questions.length - 1) {
      navHtml = `<button class="btn btn-primary btn-block" onclick="pkNext()" style="margin-top:12px">下一题 →</button>`;
    } else {
      if (!isP2) {
        navHtml = `<button class="btn btn-accent btn-block" onclick="pkSwitchPlayer()" style="margin-top:12px">轮到${esc(state.users.user2.name)}了！换人 🔄</button>`;
      } else {
        navHtml = `<button class="btn btn-accent btn-block" onclick="pkFinish()" style="margin-top:12px">查看PK结果 🏆</button>`;
        }
    }
  }

  const subjectInfo = q.subject ? SUBJECTS[q.subject] : null;

  app.innerHTML = `
    <div style="padding:16px 0 8px">
      <div style="font-size:16px;font-weight:800;text-align:center;margin-bottom:4px">
        ⚔️ ${pName}答题中
      </div>
      <div style="font-size:12px;color:var(--text2);text-align:center">${idx+1} / ${ps.questions.length}</div>
    </div>
    ${subjectInfo ? `<div style="font-size:12px;color:var(--text2);margin-bottom:8px">${subjectInfo.icon} ${subjectInfo.name} · ${q.diff}</div>` : ''}
    <div class="question-card fade-in">
      <div class="question-num">第 ${idx+1} 题</div>
      <div class="question-text">${q.q.replace(/\n/g,'<br>')}</div>
      ${optionsHtml}
      ${expHtml}
      ${navHtml}
    </div>
  `;
}

function pkSelectAnswer(idx) {
  if (!pkState) return;
  const ps = pkState;
  const currentAnswers = ps.phase === 'player2' ? ps.player2Answers : ps.player1Answers;
  if (currentAnswers[ps.currentIndex] !== undefined) return;
  currentAnswers[ps.currentIndex] = idx;

  // Update user stats for current player
  const uid = ps.phase === 'player2' ? 'user2' : 'user1';
  const u = state.users[uid];
  const q = ps.questions[ps.currentIndex];
  u.totalQuestions++;
  const pkCorrect = idx === q.ans;
  incSubjectStat(uid, getQuestionSubject(q.id), pkCorrect);
  if (pkCorrect) {
    u.correctCount++;
  } else {
    if (!u.wrongBook.includes(q.id)) u.wrongBook.push(q.id);
  }
  checkStreak(uid);
  saveState();

  renderPKQuiz();
}

function pkNext() {
  pkState.currentIndex++;
  renderPKQuiz();
  window.scrollTo(0, 0);
}

function pkSwitchPlayer() {
  pkState.phase = 'player2';
  pkState.currentIndex = 0;

  // Show switch screen
  const modal = document.getElementById('modalOverlay');
  modal.classList.add('show');
  modal.innerHTML = `
    <div class="modal fade-in" style="text-align:center">
      <h3>🔄 轮到${esc(state.users.user2.name)}了！</h3>
      <p style="color:var(--text2);font-size:13px;margin:16px 0">请将手机交给${esc(state.users.user2.name)}，准备好了点击开始</p>

    </div>
  `;
}

function pkFinish() {
  const ps = pkState;
  let s1 = 0, s2 = 0;
  ps.questions.forEach((q, i) => {
    if (ps.player1Answers[i] === q.ans) s1++;
    if (ps.player2Answers[i] === q.ans) s2++;
  });

  let winner = s1 > s2 ? 'user1' : s2 > s1 ? 'user2' : 'draw';
  if (winner !== 'draw') state.users[winner].wins++;

  state.pkResults.push({
    date: today(),
    score1: s1,
    score2: s2,
    winner
  });

  saveState();
  pkState = null;

  // Show result
  const u1 = state.users.user1;
  const u2 = state.users.user2;
  const winnerName = winner === 'user1' ? u1.name : winner === 'user2' ? u2.name : '平局';
  const rank1 = getRank(u1.wins);
  const rank2 = getRank(u2.wins);

  const modal = document.getElementById('modalOverlay');
  modal.classList.add('show');
  modal.innerHTML = `

// 发起远程PK
function startRemotePK() {
  const count = 10;
  let allQs = [];
  for (let [key, qs] of Object.entries(QUESTIONS)) {
    if (key === 'writing') continue;
    allQs.push(...qs.filter(q => q.opts && q.opts.length > 0).map(q => ({...q, subject: key})));
  }
  const shuffled = allQs.sort(() => Math.random() - 0.5).slice(0, count);

  pkState = {
    mode: 'remote',
    questions: shuffled,
    player1Answers: {},
    player1Score: 0,
    player1Name: state.users[state.currentUser].name,
    currentIndex: 0,
    phase: 'p1play' // p1play -> linkShare
  };

  renderRemotePKQuiz();
}

// 远程PK - P1答题界面
function renderRemotePKQuiz() {
  if (!pkState) return;
  const ps = pkState;
  const idx = ps.currentIndex;
  const q = ps.questions[idx];
  const answered = ps.player1Answers[idx] !== undefined;
  const userAns = ps.player1Answers[idx];

  const labels = ['A','B','C','D','E'];
  let optionsHtml = '';
  if (q.opts && q.opts.length > 0) {
    optionsHtml = '<div class="option-list">';
    q.opts.forEach((opt, i) => {
      let cls = 'option-item';
      if (answered && i === q.ans) cls += ' correct';
      else if (answered && userAns === i) cls += ' wrong';
      optionsHtml += `
        <div class="${cls}" onclick="${answered?'':'remotePKAnswer('+i+')'}">
          <span class="option-label">${labels[i]}.</span>
          <span>${opt}</span>
        </div>
      `;
    });
    optionsHtml += '</div>';
  }

  let expHtml = '';
  if (answered) {
    expHtml = `<div class="explanation" style="margin-top:12px"><strong>✅ 答案：${labels[q.ans]}</strong><br>${q.exp}</div>`;
  }

  let navHtml = '';
  if (answered) {
    if (idx < ps.questions.length - 1) {
      navHtml = `<button class="btn btn-primary btn-block" onclick="remotePKNext()" style="margin-top:12px">下一题 →</button>`;
    } else {
      navHtml = `<button class="btn btn-accent btn-block" onclick="remotePKDone()" style="margin-top:12px">📡 生成挑战链接</button>`;
    }
  }

  const subjectInfo = q.subject ? SUBJECTS[q.subject] : null;

  app.innerHTML = `
    <div style="padding:16px 0 8px">
      <div style="font-size:16px;font-weight:800;text-align:center;margin-bottom:4px">📡 远程PK答题</div>
      <div style="font-size:12px;color:var(--text2);text-align:center">${idx+1} / ${ps.questions.length} · 答完生成链接发给对手</div>
    </div>
    ${subjectInfo ? `<div style="font-size:12px;color:var(--text2);margin-bottom:8px">${subjectInfo.icon} ${subjectInfo.name} · ${q.diff}${q.src ? ' · 📚 '+q.src : ''}</div>` : ''}
    <div class="question-card fade-in">
      <div class="question-num">第 ${idx+1} 题</div>
      <div class="question-text">${q.q.replace(/\n/g,'<br>')}</div>
      ${optionsHtml}
      ${expHtml}
      ${navHtml}
    </div>
  `;
}

function remotePKAnswer(idx) {
  if (!pkState) return;
  const ps = pkState;
  if (ps.player1Answers[ps.currentIndex] !== undefined) return;
  ps.player1Answers[ps.currentIndex] = idx;

  const uid = state.currentUser;
  const u = state.users[uid];
  const q = ps.questions[ps.currentIndex];
  u.totalQuestions++;
  const rpkCorrect = idx === q.ans;
  incSubjectStat(uid, getQuestionSubject(q.id), rpkCorrect);
  if (rpkCorrect) u.correctCount++;
  else if (!u.wrongBook.includes(q.id)) u.wrongBook.push(q.id);
  checkStreak(uid);
  saveState();

  renderRemotePKQuiz();
}

function remotePKNext() {
  pkState.currentIndex++;
  renderRemotePKQuiz();
  window.scrollTo(0, 0);
}

function copyChallengeLink() {
  const linkEl = document.getElementById('challengeLinkText');
  const text = linkEl.textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✅ 已复制！';
    btn.style.background = 'var(--green)';
    setTimeout(() => { btn.textContent = '📋 复制链接'; btn.style.background = ''; }, 2000);
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('链接已复制！');
  });
}

function shareChallenge() {
  const linkEl = document.getElementById('challengeLinkText');
  const text = linkEl.textContent;
  const shareText = `⚔️ MBA刷题王PK挑战！我答完了，来应战！\n${text}`;
  if (navigator.share) {
    navigator.share({ title: 'MBA刷题王PK挑战', text: shareText }).catch(() => {});

  }
}

// 生成挑战链接（P1答完后调用）
function generateChallengeLink(questions, answers, score, playerName) {
  const data = {
    q: questions.map(q => q.id),     // 题目ID列表
    a: answers,                       // P1答案 {index: answer}
    s: score,                         // P1分数
    n: playerName,                    // P1名字
    t: Date.now()                     // 时间戳
  };
  const encoded = btoa(JSON.stringify(data));
  return window.location.origin + window.location.pathname + '?pk=' + encodeURIComponent(encoded);
}

function drawRadar() {
  const canvas = document.getElementById('radarChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const uid = state.currentUser;
  const u = state.users[uid];
  const accuracy = u.totalQuestions > 0 ? u.correctCount / u.totalQuestions : 0;

  const labels = ['数学','逻辑','写作','英语'];
  const subjects = ['math','logic','writing','english'];
  const colors = ['#e94560','#9c27b0','#00bcd4','#f5c518'];
  const values = subjects.map(key => {
    const ss = u.subjectStats || {};
    const s = ss[key] || {done:0, correct:0};
    return s.done > 0 ? Math.max(0.1, s.correct / s.done) : 0.1;
  });

  const cx = 140, cy = 140, r = 100;
  const n = labels.length;

  ctx.clearRect(0, 0, 280, 280);

  // Draw grid
  for (let level = 1; level <= 4; level++) {
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
      const x = cx + r * level / 4 * Math.cos(angle);
      const y = cy + r * level / 4 * Math.sin(angle);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.stroke();
  }

  // Draw axes
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + r * Math.cos(angle), cy + r * Math.sin(angle));
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.stroke();
  }

  // Draw data
  ctx.beginPath();
  for (let i = 0; i <= n; i++) {
    const idx = i % n;
    const angle = (Math.PI * 2 * idx / n) - Math.PI / 2;
    const val = values[idx];
    const x = cx + r * val * Math.cos(angle);
    const y = cy + r * val * Math.sin(angle);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.fillStyle = 'rgba(233,69,96,0.2)';
  ctx.fill();
  ctx.strokeStyle = '#e94560';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Draw points and labels
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
    const val = values[i];
    const x = cx + r * val * Math.cos(angle);
    const y = cy + r * val * Math.sin(angle);
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fillStyle = colors[i];
    ctx.fill();

    // Label
    const lx = cx + (r + 20) * Math.cos(angle);
    const ly = cy + (r + 20) * Math.sin(angle);
    ctx.font = '12px sans-serif';
    ctx.fillStyle = '#e8e8e8';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(labels[i], lx, ly);
  }
}

function withTimeout(promise, ms) {
  return Promise.race([
    promise,
    new Promise((_, reject) =>
      setTimeout(() => reject(new Error('⏱️ 网络超时（' + Math.round(ms/1000) + '秒），云端服务可能无法访问。请确认网络可翻墙后再试，或使用本地模式刷题')), ms)
    ]);
}

function buildProgressPayload(localUser) {
  return {
    wins: localUser.wins||0, streak: localUser.streak||0,
    max_streak: localUser.maxStreak||0, total_questions: localUser.totalQuestions||0,
    correct_count: localUser.correctCount||0, last_study_date: localUser.lastStudyDate||null,
    study_days: localUser.studyDays||{}, wrong_book: localUser.wrongBook||[],
    today_time: localUser.todayTime||0, pk_history: localUser.pkHistory||[],
    subject_stats: localUser.subjectStats||{}
  };
}

function applyProgressToLocal(cloudRec, targetUser) {
  if(!cloudRec) return false;
  let changed=false;
  const m={wins:'wins',streak:'streak',max_streak:'maxStreak',total_questions:'totalQuestions',
    correct_count:'correctCount',last_study_date:'lastStudyDate',today_time:'todayTime'};
  for(let [ck,lk] of Object.entries(m)){
    if(cloudRec[ck]!==undefined&&cloudRec[ck]!==targetUser[lk]){targetUser[lk]=cloudRec[ck];changed=true;}
  }
  if(cloudRec.study_days){for(let[d,v]of Object.entries(cloudRec.study_days)){if(!targetUser.studyDays[d]){targetUser.studyDays[d]=v;changed=true;}}}
  if(Array.isArray(cloudRec.wrong_book)){const s=new Set(targetUser.wrongBook);for(let id of cloudRec.wrong_book){if(!s.has(id)){targetUser.wrongBook.push(id);s.add(id);changed=true;}}}
  if(Array.isArray(cloudRec.pk_history)){const s=new Set(targetUser.pkHistory.map(h=>h.id||JSON.stringify(h)));for(let h of cloudRec.pk_history){const hid=h.id||JSON.stringify(h);if(!s.has(h)){targetUser.pkHistory.push(h);s.add(hid);changed=true;}}}
  if(cloudRec.subject_stats){for(let sub of ['math','logic','writing','english']){if(cloudRec.subject_stats[sub]){if(!targetUser.subjectStats[sub])targetUser.subjectStats[sub]={done:0,correct:0};if(cloudRec.subject_stats[sub].done>targetUser.subjectStats[sub].done){targetUser.subjectStats[sub].done=cloudRec.subject_stats[sub].done;changed=true;}if(cloudRec.subject_stats[sub].correct>targetUser.subjectStats[sub].correct){targetUser.subjectStats[sub].correct=cloudRec.subject_stats[sub].correct;changed=true;}}}}
  return changed;
}

}

  const sb=getSupabase();if(!sb) throw new Error('未连接');
  const{data,error}=await sb.from('pk_invitations').insert({
    from_user_id:cloudUser.id,to_user_id:toUserId,status:'pending',
    quiz_mode:mode||'mixed',question_count:count||10
  }).select().single();
  if(error) throw error;
  return data;
}

async function respondPKInvite(inviteId,accept) {
  const sb=getSupabase();if(!sb) return;
  await sb.from('pk_invitations').update({status:accept?'accepted':'rejected'}).eq('id',inviteId);
}

async function fetchPendingInvites() {
  if(!cloudUser) return [];
  const sb=getSupabase();if(!sb) return [];
  const{data}=await sb.from('pk_invitations')
    .select('*,from_user:profiles!pk_invitations_from_user_id_fkey(*)')
    .eq('to_user_id',cloudUser.id).eq('status','pending').order('created_at',{ascending:false});
  return data||[];
}

function subscribePKInvites() {
  if(!cloudUser||_pkChannel) return;
  const sb=getSupabase();if(!sb) return;
  _pkChannel=sb.channel('pk-invites-ch')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'pk_invitations',filter:`to_user_id=eq.${cloudUser.id}`},async(payload)=>{
      const inv=payload.new;
      const fromP=await getProfileById(inv.from_user_id);
      showPKNotification(inv,fromP);
    })
    .subscribe();
}

function unsubscribePKInvites(){if(_pkChannel){_pkChannel.unsubscribe();_pkChannel=null;}}

function showPKNotification(invite,fromProfile){
  const name=fromProfile?.nickname||'对方';
  const modeMap={math:'数学',logic:'逻辑',writing:'写作',english:'英语',mixed:'综合'};
  const modeLabel=modeMap[invite.quiz_mode]||invite.quiz_mode;
  const confirmed=confirm(`${name} 向你发起了PK挑战！\n📋 ${modeLabel} · ${invite.question_count}道题\n\n接受挑战吗？`);
  if(confirmed){
    respondPKInvite(invite.id,true).then(()=>{
      showToast('已接受PK挑战 ⚔️');navigate('pk');
    }).catch(e=>showToast('操作失败: '+e.message));
  }else{
    respondPKInvite(invite.id,false).catch(()=>{});
  }
}

// ---- LOGIN MODAL UI ----

let _loginMode='signin'; // signin or signup

function showLoginModal(mode){
  _loginMode=mode||'signin';
  const isSignup=_loginMode==='signup';
  const overlay=document.createElement('div');
  overlay.className='auth-overlay';
  overlay.id='authModal';
  overlay.onclick=function(e){if(e.target===overlay)closeModal();};
  overlay.innerHTML=`
    <div class="auth-modal fade-in">
      <h2>${isSignup?'注册账户':'登录账户'}</h2>
      <p class="auth-subtitle">${isSignup?'创建你的云端学习账户':'登录后自动同步进度'}</p>
      <div class="auth-input-group">
        <label class="auth-label">邮箱</label>
        <input class="auth-input" id="authEmail" type="email" placeholder="your@email.com" autocomplete="email">
      </div>
      ${isSignup?`
      <div class="auth-input-group">
        <label class="auth-label">昵称</label>
        <input class="auth-input" id="authNickname" type="text" placeholder="你的称呼">
      </div>`:''}
      <div class="auth-input-group">
        <label class="auth-label">密码</label>
        <input class="auth-input" id="authPassword" type="password" placeholder="${isSignup?'至少6位':'输入密码'}" autocomplete="${isSignup?'new-password':'current-password'}">
      </div>
      ${isSignup?`
      <div class="auth-input-group">
        <label class="auth-label">手机号（可选，用于联盟匹配）</label>
        <input class="auth-input" id="authPhone" type="tel" placeholder="用于让联盟伙伴找到你">
      </div>`:''}
      <div class="auth-error" id="authError"></div>
      <div class="auth-btn-row">
        <button class="btn btn-primary" onclick="${isSignup ? 'handleSignUp()' : 'handleSignIn()'}">${isSignup ? '📝 注册' : '🔑 登录'}</button>
      </div>
      <div class="auth-switch-mode">
        ${isSignup?'已有账户？<a onclick="showLoginModal(\'signin\')">去登录</a>':'没有账户？<a onclick="showLoginModal(\'signup\')">去注册</a>'}
      </div>
    </div>`;
  document.body.appendChild(overlay);
  setTimeout(()=>{const el=document.getElementById('authEmail');if(el)el.focus();},100);
}

function closeModal(){
  const el=document.getElementById('authModal');
  if(el) el.remove();
}

// ---- INIT SESSION ----

async function initSupabaseSession(){
  try {
    if(!window._cloudReady && !window.supabase){ console.log('[Cloud] SDK未就绪，跳过初始化'); return; }
    var sb=getSupabase();if(!sb) return;
    var session = await withTimeout(getCurrentSession(), 8000);
    if(session && session.user){
      cloudUser=session.user;
      await withTimeout(ensureProfile(session.user), 5000);
      var cp = await withTimeout(pullProgress(session.user.id), 8000);
      if(cp){var changed=applyProgressToLocal(cp,state.users[state.currentUser]);if(changed)saveState();}
      subscribePKInvites();
      console.log('[Cloud] Logged in as',cloudProfile?.nickname);
      render(); // 刷新UI显示登录状态
    }
  } catch(e) {
    console.warn('[Cloud] 会话初始化失败（不影响本地使用）:', e.message);
  }
}

// ==================== INIT ====================
render();
// 延迟初始化云端（给CDN加载留时间）
setTimeout(function(){ initSupabaseSession(); }, 1500);
</script>
