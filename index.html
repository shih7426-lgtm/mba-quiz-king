writing: [
  {id:'w1',type:'effectiveness',diff:'中等',src:'真题2021',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"随着人工智能的发展，越来越多的工作将被AI取代。据统计，未来10年内，50%的工作岗位会消失。因此，大量人口将面临失业危机。面对这一趋势，政府应该停止推广人工智能技术，以保护就业。"',opts:[],
    ans:'-',exp:'逻辑缺陷：\n1. **偷换概念**："50%岗位消失"≠50%的人失业，旧岗位消失的同时会创造新岗位\n2. **以偏概全**：用"未来10年"的预测当作确定事实\n3. **因果不当**：AI取代岗位≠导致失业危机，人可以转岗\n4. **结论不当**：停止推广AI是因噎废食，忽略了AI对生产力的正面作用\n5. **非此即彼**：在发展AI和保护就业之间并非只能二选一',sampleAnswer:'上述论证存在以下逻辑缺陷：\n\n首先，"50%岗位消失"不等于50%的人失业。历史上每次技术革命都消灭了大量旧岗位，同时也创造了更多新岗位。论证者将"岗位消失"等同于"人员失业"，犯了偷换概念的错误。\n\n其次，"未来10年50%岗位消失"这一统计数据的来源和可靠性未经验证，将不确定的预测当作确定事实，论证缺乏说服力。\n\n再次，AI取代岗位与失业危机之间并非必然因果关系。劳动者可以通过培训转岗，适应新的工作需求。\n\n最后，"停止推广AI以保护就业"这一建议是非此即彼的错误。发展AI与保护就业并不矛盾，可以通过政策引导实现两者兼顾。'},
  {id:'w2',type:'essay',diff:'困难',src:'真题2020',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"有人说，成功需要坚持；也有人说，成功需要懂得放弃。"',opts:[],
    ans:'-',exp:'写作要点：\n1. 可立论"坚持与放弃的辩证统一"\n2. 坚持：对目标的执着，如爱迪生千次实验\n3. 放弃：对方法的调整，如企业战略转型\n4. 辩证统一：坚持目标、放弃执念\n5. MBA视角：企业战略中坚持核心、放弃边缘',sampleAnswer:'坚持与放弃的智慧\n\n坚持是一种力量，放弃是一种智慧。在人生的十字路口，我们既需要坚持的勇气，也需要放弃的决断。坚持与放弃，看似对立，实则统一——坚持的是方向，放弃的是方法。\n\n坚持是成功之基。爱迪生经历上千次失败仍不放弃，最终点亮了世界。马云在阿里巴巴最困难时期咬牙坚持，才有了今天的商业帝国。正如丘吉尔所言："成功不是终点，失败也不是终结，唯有继续前进的勇气才是关键。"坚持让我们在逆境中看到希望，在困难中积蓄力量。\n\n然而，盲目的坚持往往是固执。懂得放弃，同样需要勇气和智慧。诺基亚曾经是手机行业霸主，但当智能机时代来临，它坚持塞班系统不愿放弃，最终被市场淘汰。反观苹果，从电脑转型做手机，正是因为懂得放弃舒适区，才开创了iPhone时代。放弃不是退缩，而是为了更好地前行。\n\n在商业世界中，坚持与放弃的辩证统一体现为企业战略的核心要义。优秀的企业家知道坚持什么——核心价值、长期目标；也知道放弃什么——过时技术、低效流程。腾讯坚持"用户为本"，同时放弃了自己的电商业务转而投资京东，正是这种智慧的体现。\n\n对备考MBA的我们而言，坚持的是梦想与初心，放弃的是无效的方法与思维定式。在坚持中学会放弃，在放弃中更好地坚持，方能到达成功的彼岸。'},
  {id:'w3',type:'effectiveness',diff:'基础',src:'真题2019',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"某公司去年利润增长了20%，因此该公司的经营管理水平有了显著提高。利润增长是衡量管理水平的唯一标准，因为利润是企业的最终目标。"',opts:[],
    ans:'-',exp:'逻辑缺陷：\n1. **单一归因**：利润增长可能由市场环境、政策利好等因素导致，不一定是管理水平提高\n2. **绝对化**：利润不是衡量管理水平的唯一标准，还有员工满意度、创新能力、社会责任等\n3. **概念混淆**：利润是目标≠利润是唯一评价标准\n4. **以果推因**：从结果反推原因，逻辑链不完整',sampleAnswer:'上述论证存在以下逻辑缺陷：\n\n首先，利润增长20%不能必然推出经营管理水平提高。利润增长可能源于市场整体向好、行业政策红利、原材料价格下降等外部因素，而非内部管理改善。论证犯了单一归因的错误。\n\n其次，"利润是衡量管理水平的唯一标准"这一判断过于绝对。企业的社会责任、员工发展、创新能力、品牌价值等同样是管理水平的重要体现。仅以利润论英雄，忽视了企业发展的多元价值。\n\n最后，将"利润是企业的最终目标"等同于"利润是唯一评价标准"，犯了概念混淆的错误。目标是企业追求的方向，但评价标准应当更加全面和多元。'},
  {id:'w4',type:'essay',diff:'中等',src:'真题2022',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"一个团队中，有能力的成员往往不太好管理，而听话的成员往往能力有限。"',opts:[],
    ans:'-',exp:'写作要点：\n1. 立论方向：管理的智慧在于包容多样性\n2. 分析"能力"与"顺从"并非对立\n3. 好的管理者能让有能力的人发挥所长\n4. MBA视角：领导力与团队建设',sampleAnswer:'管理的包容之道\n\n有能力的不好管，听话的能力有限——这道管理难题困扰着无数管理者。然而，真正的管理智慧不在于在"能力"与"顺从"之间二选一，而在于创造一个让能力与协作共存的环境。\n\n首先，"有能力"与"不好管"之间没有必然联系。能力强的员工往往思维活跃、有自己的见解，他们提出的不同意见不是"不好管"，而是组织的宝贵资产。乔布斯身边从不缺能力超群且个性鲜明的人才，正是这些"不好管"的人成就了苹果的伟大。\n\n其次，"听话"不应是管理的目标，"对齐"才是。一个团队需要的是目标一致、高效协作，而非上下级之间的无条件服从。最好的团队是每个人都能独立思考、勇于表达，同时在共同目标下协调行动。\n\n真正的领导力，在于激发而非控制。优秀的管理者像指挥家，让每种乐器在最恰当的时刻发出最美的声音。他们不是让所有人演奏同一个音符，而是让不同的声音汇成和谐的交响乐。\n\n在MBA的学习中，我们更应该理解：管理不是让有能力的人变得听话，而是让有能力的人愿意为共同的目标全力以赴。'},
  {id:'w5',type:'effectiveness',diff:'困难',src:'真题2023',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"据统计，名校毕业生的平均收入高于普通院校毕业生。因此，只要考上名校，就能获得高收入。所以，家长应该不惜一切代价让孩子上名校。"',opts:[],
    ans:'-',exp:'逻辑缺陷：\n1. **混淆统计关系与因果关系**：名校毕业生收入高可能是生源质量、社会网络等因素所致\n2. **绝对化推理**：统计上的"平均"不意味着"每个人"都如此\n3. **以偏概全**：收入不是衡量人生价值的唯一标准\n4. **滑坡谬误**：从"考上名校"推出"不惜一切代价"，逻辑跨度太大\n5. **忽略成本收益**：不惜一切代价的投入可能远超回报',sampleAnswer:'上述论证存在多处逻辑缺陷：\n\n首先，名校毕业生平均收入较高是统计事实，但这不意味着"考上名校"是"获得高收入"的原因。两者的相关性可能源于名校生源本身更优秀、名校的校友网络更广等第三方因素。将相关关系误为因果关系，论证缺乏说服力。\n\n其次，从"平均收入高"推出"只要考上就能获得高收入"，犯了绝对化推理的错误。平均数不能代表每个个体，名校毕业生中同样存在收入较低者。\n\n再次，"不惜一切代价"这一建议是滑坡谬误。如果付出的代价（如巨额学费、心理压力）远超预期收益，那么上名校反而得不偿失。决策应当进行成本收益分析，而非一味追求。\n\n最后，收入只是人生价值的一个维度，以此作为唯一标准有以偏概全之嫌。'},
  {id:'w6',type:'effectiveness',diff:'中等',src:'真题2020',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"某市调查发现，近年来该市私人汽车拥有量增长了30%，同时交通事故发生率也增长了15%。因此，私人汽车增多是交通事故增加的原因。为减少交通事故，应限制私人汽车购买。"',opts:[],
    ans:'-',exp:'逻辑缺陷：\n1. **相关≠因果**：汽车增多与事故增多可能由城市扩张、人口增长等共同因素导致\n2. **忽视人均**：汽车增30%而事故仅增15%，人均事故率可能反而下降\n3. **以偏概全**：仅凭一个城市的数据不能推广到一般结论\n4. **措施不当**：限制购车未必能减少事故，应从改善交通管理入手\n5. **遗漏变量**：未考虑道路建设、驾驶员素质等因素',sampleAnswer:'上述论证存在以下逻辑缺陷：\n\n首先，论证将相关性当作因果性。私人汽车增多和交通事故增加可能都是由城市扩张、人口增长等共同因素导致的，论证未排除这些替代解释。\n\n其次，论证忽视了基数变化。汽车拥有量增长30%而事故仅增长15%，从人均角度看，交通事故率可能不增反降，论证未能说明这一点。\n\n再次，仅凭单一城市数据就得出一般性结论，样本代表性不足，属于以偏概全。\n\n最后，即便承认汽车增多是事故增加的原因之一，限制购车也不是唯一或最优的解决方案。改善交通管理、加强驾驶员培训等措施可能更有效。'},
  {id:'w7',type:'essay',diff:'中等',src:'真题2018',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"一位企业家说：\'我最重要的不是做了多少正确的决定，而是我从错误的决定中学到了多少。\'"',opts:[],
    ans:'-',exp:'写作要点：\n1. 立论：从错误中学习比做正确决定更有价值\n2. 错误是最好的老师——爱迪生上千次实验\n3. 反思是成长的关键——从失败中提炼智慧\n4. MBA视角：创业中的试错与创新\n5. 辩证：不是鼓励犯错，而是善用错误',sampleAnswer:'从错误中成长\n\n在追求成功的道路上，人们往往关注正确的决定带来的成果，却忽视了错误决定所蕴含的成长价值。然而，正如那位企业家所言，从错误中学习，往往比做正确的决定更有意义。\n\n首先，错误是最好的老师。成功的经验容易让人自满，而失败的教训则能深刻地印在记忆中。爱迪生发明电灯时失败了上千次，但每一次失败都告诉他哪种材料不可行，最终指引他找到了正确的灯丝。正是这些"错误的尝试"成就了伟大的发明。\n\n其次，从错误中学习培养了韧性与勇气。敢于承认错误、从错误中汲取养分的人，必定拥有面对挫折的勇气和不屈不挠的精神。在瞬息万变的商业环境中，这种品质比一时的正确决策更为可贵。\n\n然而，从错误中学习并非盲目试错。关键在于反思——每一次失败后，都应深入分析原因，总结规律，避免重蹈覆辙。只有将错误转化为经验，错误才具有真正的价值。\n\n在企业经营和人生旅途中，我们不可能永远做出正确的选择。但只要善于从错误中学习，每一次跌倒都将成为迈向成功的阶梯。'},
  {id:'w8',type:'effectiveness',diff:'基础',src:'真题2017',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"这家餐厅的菜不好吃，因为我上次去的时候，有一道菜太咸了。"',opts:[],
    ans:'-',exp:'逻辑缺陷：\n1. **以偏概全**：仅凭一道菜太咸就断定整个餐厅不好吃\n2. **样本不足**：一次体验不足以评价整体\n3. **忽视偶然性**：那道菜可能只是偶然失手\n4. **标准单一**：仅以"咸淡"评价菜的好坏过于片面',sampleAnswer:'上述论证存在明显的逻辑缺陷：\n\n首先，论证以偏概全。仅凭一道菜太咸就断定整个餐厅的菜不好吃，是极不充分的。一家餐厅通常提供数十种菜品，其中一道的问题不能代表全部。\n\n其次，论证样本严重不足。仅凭一次就餐体验中的一个问题菜品，就做出整体评价，缺乏统计意义上的说服力。应综合多次就餐体验和多道菜品来评价。\n\n最后，评价标准过于单一。菜的好坏不仅取决于咸淡，还包括食材新鲜度、烹饪技巧、摆盘、口感等多个维度。仅以"太咸"一点来否定，显然有失公允。'},
  {id:'w9',type:'essay',diff:'困难',src:'真题2023',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"蚂蚁在搬运食物时，总是走最短的路线。科学家发现，蚂蚁并不是一开始就知道最短路线，而是通过不断尝试和信息共享，最终找到了最优路径。"',opts:[],
    ans:'-',exp:'写作要点：\n1. 立论：在实践中探索和优化，才能找到最佳方案\n2. 关键词"不是一开始就知道""不断尝试""信息共享"\n3. 从个体智慧到集体智慧——信息共享的力量\n4. 持续优化的思维——没有完美起点，只有不断改进\n5. MBA视角：组织学习与创新管理',sampleAnswer:'探索中求优\n\n蚂蚁虽小，却蕴含着深刻的智慧。它们不是一开始就知道最短路线，而是通过不断尝试和信息共享，最终找到了最优路径。这一现象启示我们：在实践中探索和优化，才能找到最佳方案。\n\n没有完美的起点，只有不断改进的过程。许多伟大的企业并非从一开始就找到了正确的方向。亚马逊最初只是一家网上书店，通过不断尝试和调整，才发展成为全球电商巨头。如果贝佐斯一开始就固守"卖书"的定位，就不会有今天的亚马逊。关键不在于起点是否完美，而在于是否持续优化。\n\n信息共享是集体智慧的基石。蚂蚁之所以能找到最短路线，靠的不是单只蚂蚁的智慧，而是群体间的信息传递。在企业管理中，开放沟通、知识共享同样至关重要。那些打破信息孤岛、建立协作文化的企业，往往能做出更优的决策。\n\n持续优化需要勇气和耐心。每一次尝试都可能失败，但失败中蕴含着改进的方向。正如蚂蚁走过的每一条弯路都为后来者提供了信息，企业每一次试错都为下一步优化积累了经验。\n\n在备考MBA的道路上，我们也应像蚂蚁一样：不怕起点低，勇于探索，善于分享，持续改进，终将找到属于自己的最优路径。'},
  {id:'w10',type:'effectiveness',diff:'中等',src:'真题2021',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"过去十年，全球平均气温持续上升，同时全球经济发展也在加速。因此，经济发展导致了全球变暖。"',opts:[],
    ans:'-',exp:'逻辑缺陷：\n1. **相关≠因果**：气温上升与经济发展同时发生不意味着因果关系\n2. **忽视其他因素**：全球变暖可能与温室气体排放、森林砍伐等有关\n3. **时间先后≠因果**：两件事同时发生不能推出因果\n4. **过度简化**：全球变暖是多因素综合作用的结果',sampleAnswer:'上述论证存在以下逻辑缺陷：\n\n首先，论证将时间上的相关关系直接推断为因果关系。全球气温上升和经济发展在时间上并行，但这并不意味两者之间存在因果关系。这是典型的"相关不等于因果"的错误。\n\n其次，论证忽视了大量其他可能的因素。全球变暖的成因是复杂的，包括温室气体排放增加、森林砍伐、工业化污染等。简单地将其归因于经济发展，是过度简化的推断。\n\n再次，即便经济发展与全球变暖存在某种关联，也可能是通过中介因素（如工业排放）间接影响，而非直接因果关系。论证未能阐明具体的因果机制。\n\n最后，如果经济发展导致全球变暖，我们需要解释为何某些经济高速发展的地区气温变化并不显著。缺乏具体数据支撑，论证难以令人信服。'},
  {id:'w11',type:'effectiveness',diff:'中等',src:'真题2018',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"某高校调查显示，文科生毕业后平均起薪低于理科生。因此，文科专业的教育价值低于理科专业。学生应优先选择理科专业。"',opts:[],ans:'-',exp:'逻辑缺陷：\n1. **偷换概念**：起薪≠教育价值\n2. **以偏概全**：仅用起薪衡量专业价值过于片面\n3. **忽略长远发展**：起薪不等于终身收入\n4. **非此即彼**：选择专业还需考虑兴趣等因素',sampleAnswer:'上述论证将"起薪"等同于"教育价值"，犯了偷换概念的错误。教育的价值不仅体现在经济回报上，还包括人文素养、批判性思维等。仅以起薪论教育价值，是片面的。\n\n其次，起薪不等同于终身收入。许多文科专业虽然起薪较低，但长期收入可能并不逊色。\n\n最后，建议"优先选择理科"犯了非此即彼的错误。选择专业应综合考虑兴趣、能力等多重因素。'},
  {id:'w12',type:'essay',diff:'中等',src:'真题2019',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"有人说，细节决定成败；也有人说，大方向比细节更重要。"',opts:[],ans:'-',exp:'写作要点：方向与细节辩证统一，先定方向再抓细节。',sampleAnswer:'方向是成功的航标，细节是成功的基石。唯有方向与细节辩证统一，方能行稳致远。\n\n方向是前提。南辕北辙的教训告诉我们，方向错了越努力离目标越远。柯达发明了数码相机却固守胶卷方向，最终被淘汰。\n\n细节是保障。张瑞敏砸冰箱树立了海尔对品质的极致追求。在商业竞争中，一个按钮的体验可能决定客户的去留。\n\n在企业管理中，战略方向与运营细节缺一不可。没有战略的细节是盲目的忙碌，没有细节的战略是空洞的口号。'},
  {id:'w13',type:'effectiveness',diff:'困难',src:'真题2022',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"统计显示，清华大学毕业生平均年薪30万元，而全国本科毕业生平均年薪仅8万元。因此，考上清华就能获得高薪。对于普通家庭来说，即使倾家荡产也要让孩子上名校。"',opts:[],ans:'-',exp:'逻辑缺陷：\n1. 混淆相关与因果\n2. 平均数谬误\n3. 滑坡谬误\n4. 忽略成本',sampleAnswer:'名校与高薪的相关性不等于因果。清华毕业生薪资高可能因生源更优秀。30万平均年薪不代表每人都能拿到。倾家荡产上名校是滑坡谬误，代价可能远超收益。'},
  {id:'w14',type:'essay',diff:'困难',src:'真题2024',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"一位将军在战败后说：\'我不是被打败了，我只是还没赢。\'"',opts:[],ans:'-',exp:'写作要点：失败≠被打败，心态决定格局。',sampleAnswer:'失败与被打败有着本质区别。失败是客观结果，被打败是主观认输。丘吉尔在二战最黑暗时没有被打败，最终赢得胜利。马斯克SpaceX前三次全部失败但永不放弃，第四次成功了。"还没赢"蕴含对未来的信念。'},
  {id:'w15',type:'effectiveness',diff:'基础',src:'真题2016',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"这家公司去年利润下降了10%，所以这家公司的管理水平在下降。"',opts:[],ans:'-',exp:'逻辑缺陷：\n1. 单一指标\n2. 忽视外部环境\n3. 短期波动不代表趋势\n4. 因果不当',sampleAnswer:'仅凭利润下降就断定管理水平下降过于片面。利润下降可能因市场环境、政策变化等外部因素。单一年度数据不能代表长期趋势。'},
  {id:'w16',type:'essay',diff:'中等',src:'真题2020',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"竹子用了4年时间仅仅长了3厘米，但从第5年开始以每天30厘米的速度疯狂生长，六周就长到了15米。"',opts:[],ans:'-',exp:'写作要点：厚积薄发，积累是爆发的前提。',sampleAnswer:'竹子前4年只长3厘米却在第5年疯长，因为前4年它在扎根。积累是爆发的根基，量变终将引发质变。每一天的坚持都在扎根，当量变积累到质变时，会感谢当初没有放弃的自己。'},
  {id:'w17',type:'effectiveness',diff:'中等',src:'真题2023',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"网购平台的用户评价显示，某品牌手机好评率达98%，远超行业平均的85%。因此，该品牌手机的质量一定比其他品牌好。"',opts:[],ans:'-',exp:'逻辑缺陷：评价偏差、样本偏差、好评率≠质量',sampleAnswer:'98%好评率可能受刷单、好评返现等影响。选择购买该品牌的消费者可能本身偏好该品牌。好评率是主观评价，质量应通过专业检测衡量。'},
  {id:'w18',type:'essay',diff:'基础',src:'真题2017',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"一个人可以走得很快，但一群人可以走得很远。"',opts:[],ans:'-',exp:'写作要点：合作的力量，团队的互补与支撑。',sampleAnswer:'速度属于个人，远方属于团队。团队之所以走得远，是因为协作产生1+1>2的力量。各有所长、互相补充、困难时互相支撑，才能行稳致远。'},
  {id:'w19',type:'effectiveness',diff:'困难',src:'真题2025',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"某国人均GDP增长了50%，因此该国居民的生活水平提高了50%。GDP是衡量生活水平的最佳指标。所以政府应该全力追求GDP增长。"',opts:[],ans:'-',exp:'逻辑缺陷：人均GDP≠生活水平、分配不均、绝对化、忽视外部性',sampleAnswer:'人均GDP增长50%不等于生活水平提高50%。新增财富可能集中在少数人手中。GDP不是衡量生活水平的最佳指标，生活质量还包括健康、教育、环境等。全力追求GDP可能牺牲其他价值。'},
  {id:'w20',type:'essay',diff:'中等',src:'真题2024',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"一家企业坚持了10年不盈利的战略，最终成为行业领导者。有人问创始人：\'你不怕亏吗？\'他说：\'我怕的是不够好，不是不够赚。\'"',opts:[],ans:'-',exp:'写作要点：长期主义，追求卓越胜过追逐利润。',sampleAnswer:'利润是卓越的副产品而非追求的目标。追求卓越的企业关注产品够不够好，而非赚多少钱。亚马逊亏损近20年最终成为全球市值最高企业之一。好的产品自带商业回报。先做到足够好，利润自然会来。'},
  {id:'w21',type:'effectiveness',diff:'困难',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"某城市限号后空气质量改善15%。因此限号是改善空气的有效措施。"',opts:[],ans:'-',exp:'以偏概全：可能因工业减排等其他因素；忽视了季节性因素；单一指标不足以论证因果。',sampleAnswer:'限号出行与空气质量改善之间可能只是时间上的相关性，工业减排、气象条件变化等都可能是真正原因。'},
  {id:'w22',type:'effectiveness',diff:'中等',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"名校毕业生平均收入高40%。因此上名校是获得高收入的关键。"',opts:[],ans:'-',exp:'相关不等于因果：名校生源更优秀；平均数不代表个体；高收入可能由家庭背景等导致。',sampleAnswer:'名校与高收入的相关性可能源于生源本身更优秀、家庭资源更丰富等。'},
  {id:'w23',type:'effectiveness',diff:'中等',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"弹性工作制后员工满意度提高20%。因此弹性工作制能提高满意度。"',opts:[],ans:'-',exp:'可能存在他因：同时期提高薪资、改善环境；满意度调查存在样本偏差。',sampleAnswer:'满意度提升可能是薪资调整、环境改善等同期变化的综合结果。'},
  {id:'w24',type:'effectiveness',diff:'困难',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"早睡早起的人更健康。因此早睡早起是健康的原因。"',opts:[],ans:'-',exp:'因果倒置：健康的人更有精力早起；忽视了他因：运动多、饮食好等。',sampleAnswer:'健康与早起可能互为因果而非单向，健康的人精力充沛更倾向于早起。'},
  {id:'w25',type:'effectiveness',diff:'中等',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"某品牌手机销量增长30%，因此质量提升了。"',opts:[],ans:'-',exp:'销量≠质量：可能因营销、降价、竞品退出等；消费者选择不一定基于质量。',sampleAnswer:'销量增长与质量之间没有必然联系，可能是营销策略或价格调整的结果。'},
  {id:'w26',type:'effectiveness',diff:'中等',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"培训机构学员通过率95%，因此教学质量优秀。"',opts:[],ans:'-',exp:'样本偏差：可能只统计完成培训的学员；入学筛选严格；未与基准对比。',sampleAnswer:'95%通过率可能有统计偏差：只统计完成课程者、入学时已筛选。'},
  {id:'w27',type:'effectiveness',diff:'困难',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"GDP增长率从3%到5%，因此经济实力增强了。"',opts:[],ans:'-',exp:'增长率≠实力：可能因基数低；可能伴随通胀；增长可能集中在少数行业。',sampleAnswer:'GDP增长需考虑基数效应、通胀因素和增长质量。'},
  {id:'w28',type:'effectiveness',diff:'中等',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"每天冥想10分钟焦虑水平低。因此冥想减少焦虑。"',opts:[],ans:'-',exp:'他因：冥想者可能本身更关注心理健康；自选择偏差。',sampleAnswer:'冥想者可能本身就采取了多种减压方式，不能单一归因于冥想。'},
  {id:'w29',type:'effectiveness',diff:'中等',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"数字化转型后利润增长25%。因此数字化转型能提高利润。"',opts:[],ans:'-',exp:'他因：市场需求增长、成本控制改善；利润可能是多因素结果。',sampleAnswer:'利润增长可能是多因素综合结果，不能单一归因。'},
  {id:'w30',type:'effectiveness',diff:'困难',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"线上购物满意度逐年提高。因此线上体验越来越好。"',opts:[],ans:'-',exp:'他因：消费者期望降低、样本偏差、满意度量表变化。',sampleAnswer:'满意度提高可能因消费者适应了线上体验或降低了期望值。'},
  {id:'w31',type:'effectiveness',diff:'中等',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"小班教学后学生成绩提高了。因此小班教学效果更好。"',opts:[],ans:'-',exp:'他因：更好师资、学生家庭条件更好；可能因其他教学改革。',sampleAnswer:'小班可能伴随其他优势，成绩提高不能单一归因于班级规模。'},
  {id:'w32',type:'effectiveness',diff:'中等',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"经常吃早餐的人体重更轻。因此吃早餐有助于减肥。"',opts:[],ans:'-',exp:'因果倒置：健康体重的人更可能有规律饮食习惯包括吃早餐。',sampleAnswer:'体重与早餐的关系可能反向：健康→规律饮食包括吃早餐。'},
  {id:'w33',type:'effectiveness',diff:'困难',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"地铁开通后沿线房价上涨20%。因此地铁推高房价。"',opts:[],ans:'-',exp:'他因：沿线可能同时有其他开发；房价上涨可能因整体市场趋势。',sampleAnswer:'沿线房价上涨可能因整体市场趋势、区域开发等。'},
  {id:'w34',type:'effectiveness',diff:'中等',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"引入AI后效率提高30%。因此AI提升工作效率。"',opts:[],ans:'-',exp:'他因：同时优化了流程、培训了员工；包含学习曲线效应。',sampleAnswer:'效率提升可能是AI+流程优化+培训的综合结果。'},
  {id:'w35',type:'effectiveness',diff:'中等',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"经常旅游的人幸福感更高。因此旅游提高幸福感。"',opts:[],ans:'-',exp:'因果倒置：幸福感高的人更愿意旅游；经济条件好的人既旅游又幸福。',sampleAnswer:'可能幸福感高→更愿意旅游，而非旅游→幸福感高。'},
  {id:'w36',type:'effectiveness',diff:'困难',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"996后营收增长50%。因此996提升业绩。"',opts:[],ans:'-',exp:'他因：行业整体增长；员工疲劳可能影响长期产出；可持续性存疑。',sampleAnswer:'营收增长可能因行业红利而非加班，长期看员工疲劳可能降低效率。'},
  {id:'w37',type:'effectiveness',diff:'中等',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"学历越高收入越高。因此提高学历能增加收入。"',opts:[],ans:'-',exp:'相关不等于因果：高学历者可能家庭背景好、能力强；收入受多种因素影响。',sampleAnswer:'高学历与高收入的相关性可能源于家庭背景等共同因素。'},
  {id:'w38',type:'effectiveness',diff:'中等',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"更换包装后销量增长15%。因此新包装促进销售。"',opts:[],ans:'-',exp:'他因：同时可能促销；季节性因素；消费者好奇心短期效应。',sampleAnswer:'销量增长可能因促销或季节因素，新包装可能只是短期好奇心效应。'},
  {id:'w39',type:'effectiveness',diff:'困难',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"垃圾分类后环保意识提高了。因此垃圾分类提升环保意识。"',opts:[],ans:'-',exp:'他因：同时有环保宣传；环保意识提高可能是大趋势。',sampleAnswer:'环保意识提高可能因整体社会趋势和宣传。'},
  {id:'w40',type:'effectiveness',diff:'中等',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"经常写日记的人心理更健康。因此写日记改善心理健康。"',opts:[],ans:'-',exp:'因果倒置：心理健康的人更愿意自我反思和写日记。',sampleAnswer:'心理更健康的人更倾向于写日记，而非写日记导致心理健康。'},
  {id:'w41',type:'effectiveness',diff:'中等',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"广告投入增加后市场份额提升。因此广告增加份额。"',opts:[],ans:'-',exp:'他因：产品改进、渠道扩展、竞品问题等；广告只是因素之一。',sampleAnswer:'市场份额提升可能是多因素结果。'},
  {id:'w42',type:'effectiveness',diff:'困难',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"素质教育后学生创新能力提高。因此素质教育培养创新能力。"',opts:[],ans:'-',exp:'他因：同时有其他教育改革；创新能力评价标准可能变化。',sampleAnswer:'创新能力提升可能是多种改革综合作用的结果。'},
  {id:'w43',type:'effectiveness',diff:'中等',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"已婚人士比单身寿命更长。因此结婚延长寿命。"',opts:[],ans:'-',exp:'因果倒置：健康状况影响结婚概率；已婚者可能生活更规律。',sampleAnswer:'健康影响结婚选择，寿命长可能因更健康的人更容易结婚。'},
  {id:'w44',type:'effectiveness',diff:'中等',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"远程办公后满意度提高。因此远程办公提高满意度。"',opts:[],ans:'-',exp:'样本偏差：不满意的员工可能已离职；同时有其他福利改善。',sampleAnswer:'满意度提高可能因不满意的员工已离职。'},
  {id:'w45',type:'effectiveness',diff:'困难',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"引进新设备后治愈率提高10%。因此新设备提升治疗效果。"',opts:[],ans:'-',exp:'他因：可能同时引进新医生；患者选择偏差；统计显著性未验证。',sampleAnswer:'治愈率提高可能因新医生或患者结构变化。'},
  {id:'w46',type:'effectiveness',diff:'中等',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"健身房的会员比非会员更健康。因此健身使人健康。"',opts:[],ans:'-',exp:'他因：已经是健康的人更愿意办健身卡；样本自选择偏差。',sampleAnswer:'健康的人更可能办健身卡，因果方向可能相反。'},
  {id:'w47',type:'effectiveness',diff:'中等',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"使用AI工具的企业效率更高。因此AI提升企业效率。"',opts:[],ans:'-',exp:'他因：使用AI的企业可能本身就更注重技术创新；效率高的企业更愿意尝试AI。',sampleAnswer:'采用AI的企业可能本身就更先进，AI只是表现而非原因。'},
  {id:'w48',type:'effectiveness',diff:'中等',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"读MBA的人收入更高。因此读MBA能提高收入。"',opts:[],ans:'-',exp:'他因：能读MBA的人本身能力更强、资源更多；MBA学员的自选择偏差。',sampleAnswer:'读MBA的人可能本身就更优秀，MBA筛选而非培养导致收入差异。'},
  {id:'w49',type:'effectiveness',diff:'中等',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"有花园的房屋价格更高。因此花园增加房屋价值。"',opts:[],ans:'-',exp:'他因：有花园的房屋通常面积更大、地段更好。',sampleAnswer:'花园与价格的相关可能因面积和地段等共同因素。'},
  {id:'w50',type:'effectiveness',diff:'中等',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"经常做饭的人饮食更健康。因此做饭有助于健康饮食。"',opts:[],ans:'-',exp:'因果倒置：关注健康饮食的人更愿意自己做饭。',sampleAnswer:'关注健康的人更倾向于做饭，而非做饭导致健康。'},
  {id:'w51',type:'effectiveness',diff:'中等',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"使用社交媒体多的青少年更焦虑。因此社交媒体导致焦虑。"',opts:[],ans:'-',exp:'他因：焦虑的青少年可能更依赖社交媒体作为社交替代；因果方向可能相反。',sampleAnswer:'焦虑的青少年可能更依赖社交媒体，而非社交媒体导致焦虑。'},
  {id:'w52',type:'effectiveness',diff:'中等',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"养狗的人血压更低。因此养狗能降低血压。"',opts:[],ans:'-',exp:'他因：养狗的人可能散步更多、社交更多；血压低的人可能更有精力养狗。',sampleAnswer:'养狗与低血压的相关可能因更多运动和社交。'},
  {id:'w53',type:'effectiveness',diff:'中等',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"参与志愿服务的学生成绩更好。因此志愿服务提升成绩。"',opts:[],ans:'-',exp:'他因：参与志愿服务的学生可能本身更有责任感和自律性。',sampleAnswer:'成绩好的学生可能更有时间和意愿参与志愿服务。'},
  {id:'w54',type:'effectiveness',diff:'中等',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"喝咖啡的人更长寿。因此咖啡延长寿命。"',opts:[],ans:'-',exp:'他因：喝咖啡的人可能饮食更规律、社交更多；因果倒置可能性。',sampleAnswer:'长寿者可能更有习惯包括喝咖啡，而非咖啡导致长寿。'},
  {id:'w55',type:'effectiveness',diff:'中等',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"接受过职业培训的员工晋升更快。因此职业培训促进晋升。"',opts:[],ans:'-',exp:'他因：主动接受培训的员工本身更上进；公司可能优先培训高潜力员工。',sampleAnswer:'上进心既是接受培训的原因也是晋升的原因。'},
  {id:'w56',type:'effectiveness',diff:'中等',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"素食者患心脏病概率低。因此素食预防心脏病。"',opts:[],ans:'-',exp:'他因：素食者通常更注重健康、不吸烟、多运动。',sampleAnswer:'素食者整体生活方式更健康，心脏病风险低可能是多种因素。'},
  {id:'w57',type:'effectiveness',diff:'中等',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"拥有大学学位的创业者成功率更高。因此学历有助创业成功。"',opts:[],ans:'-',exp:'他因：大学学位者可能有更好的人脉和资源；自选择偏差。',sampleAnswer:'学位与创业成功的相关可能因人脉、资源等共同因素。'},
  {id:'w58',type:'effectiveness',diff:'中等',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"每天吃水果的人免疫力更强。因此水果增强免疫力。"',opts:[],ans:'-',exp:'他因：吃水果的人整体饮食习惯更好；免疫力强的人更注意饮食。',sampleAnswer:'整体饮食健康可能是真正原因，而非单一的水果。'},
  {id:'w59',type:'effectiveness',diff:'中等',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"双语使用者认知衰退更慢。因此双语延缓认知衰退。"',opts:[],ans:'-',exp:'他因：双语者可能教育水平更高、社交更活跃。',sampleAnswer:'双语者可能有更高的教育水平和更丰富的社交活动。'},
  {id:'w60',type:'effectiveness',diff:'中等',q:'论证有效性分析：分析下列论证的逻辑缺陷。\n\n"使用共享办公的创业者融资更多。因此共享办公有助融资。"',opts:[],ans:'-',exp:'他因：使用共享办公的创业者可能资源更丰富、更善于社交。',sampleAnswer:'融资多可能是创业者本身能力强的结果，而非共享办公的效果。'},
  {id:'w61',type:'essay',diff:'中等',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"有人说：\'失败是成功之母\'；也有人说：\'成功才是成功之母\'。"',opts:[],ans:'-',exp:'失败与成功的辩证关系。失败提供教训，成功增强信心。两者相辅相成。',sampleAnswer:'失败提供教训和韧性，成功给予信心和方向。真正的成长需要两者交替锤炼。'},
  {id:'w62',type:'essay',diff:'困难',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"一位企业家说：\'我不怕犯错，我怕不去尝试。\'"',opts:[],ans:'-',exp:'勇气与行动的重要性。不尝试永远不会成功，犯错是成长的代价。',sampleAnswer:'每一个伟大成就背后都有无数次尝试和犯错。唯有行动才能检验想法。'},
  {id:'w63',type:'essay',diff:'中等',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"有人说：\'选择比努力更重要\'；也有人说：\'不努力连选择的机会都没有\'。"',opts:[],ans:'-',exp:'选择与努力的辩证。选择决定方向，努力决定能走多远。',sampleAnswer:'选择是方向，努力是动力。两者缺一不可。'},
  {id:'w64',type:'essay',diff:'困难',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"竹子扎根4年仅长3厘米，第5年六周疯长15米。"',opts:[],ans:'-',exp:'厚积薄发。积累是爆发的前提，量变引发质变。',sampleAnswer:'成功不是一蹴而就的，耐心扎根终会迎来拔节生长的时刻。'},
  {id:'w65',type:'essay',diff:'中等',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"一位将军战败后说：\'我不是被打败了，我只是还没赢。\'"',opts:[],ans:'-',exp:'心态决定格局。失败是暂时的，放弃才是永久的。',sampleAnswer:'失败与被打败有本质区别。保持\'还没赢\'的心态，才能在逆境中找到转机。'},
  {id:'w66',type:'essay',diff:'困难',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"一滴水只有融入大海才不会干涸。"',opts:[],ans:'-',exp:'个人与团队。个体的力量有限，融入集体才能实现更大价值。',sampleAnswer:'个体如水滴般微小，融入团队才能汇聚成大海。'},
  {id:'w67',type:'essay',diff:'中等',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"有人说：\'简单就是美\'；也有人说：\'简单意味着肤浅\'。"',opts:[],ans:'-',exp:'简约与深刻。简约不等于简单，真正的简约是复杂之后的提炼。',sampleAnswer:'简约是复杂的最高形式。真正的简约是去除冗余后对本质的把握。'},
  {id:'w68',type:'essay',diff:'困难',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"一只蝴蝶扇动翅膀可能引起远方的风暴。"',opts:[],ans:'-',exp:'小事情可能产生大影响。关注细节，重视每一个小的改变。',sampleAnswer:'微小变化可能带来巨大影响，一个细节改进可能引发连锁反应。'},
  {id:'w69',type:'essay',diff:'中等',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"有人说：\'做正确的事比正确地做事更重要\'。"',opts:[],ans:'-',exp:'战略方向与运营效率。方向对了效率才有意义。',sampleAnswer:'做正确的事是战略问题，正确地做事是运营问题。方向错了效率越高偏离越远。'},
  {id:'w70',type:'essay',diff:'困难',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"一位CEO说：\'最大的竞争对手不是别人，而是自己。\'"',opts:[],ans:'-',exp:'自我超越的重要性。持续进步比击败对手更有价值。',sampleAnswer:'真正的竞争是与自己赛跑。战胜自己意味着不断突破舒适区。'},
  {id:'w71',type:'essay',diff:'中等',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"有人说：\'速度决定一切\'；也有人说：\'欲速则不达\'。"',opts:[],ans:'-',exp:'速度与质量的平衡。快速行动重要，质量不可忽视。',sampleAnswer:'速度与质量并非对立，关键是找到平衡点。'},
  {id:'w72',type:'essay',diff:'困难',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"一位经理说：\'我不需要最聪明的人，我需要最合适的人。\'"',opts:[],ans:'-',exp:'人才匹配比人才优秀更重要。合适的人创造最大价值。',sampleAnswer:'最优秀的人不一定最适合。团队协作和文化匹配比个人能力更重要。'},
  {id:'w73',type:'essay',diff:'中等',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"有人认为规则限制了创造力；也有人认为没有规则就没有创造力。"',opts:[],ans:'-',exp:'规则与创造力的辩证。规则提供框架，创造力在框架内突破。',sampleAnswer:'创造力不是无中生有，而是在约束中寻找可能。'},
  {id:'w74',type:'essay',diff:'困难',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"一位创业者说：\'最好的投资是投资自己。\'"',opts:[],ans:'-',exp:'自我投资的重要性。知识、能力、健康是最有价值的资产。',sampleAnswer:'外在投资有涨有跌，唯有对自己的投资不会贬值。'},
  {id:'w75',type:'essay',diff:'中等',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"有人说：\'不要把所有鸡蛋放在一个篮子里\'；也有人说：\'把所有鸡蛋放一个篮子里，然后看好篮子\'。"',opts:[],ans:'-',exp:'分散与集中的策略选择。不同阶段适用不同策略。',sampleAnswer:'分散降低风险但可能平庸，集中风险更高但可能卓越。'},
  {id:'w76',type:'essay',diff:'困难',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"一位哲人说：\'未经审视的人生不值得过。\'"',opts:[],ans:'-',exp:'反思与自我认知的价值。',sampleAnswer:'反思是成长的起点。定期审视目标、方法和成果。'},
  {id:'w77',type:'essay',diff:'中等',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"水能载舟，亦能覆舟。"',opts:[],ans:'-',exp:'群众力量的两面性。管理者需要赢得人心。',sampleAnswer:'企业的\'水\'是员工和客户。善待他们则事业蒸蒸日上。'},
  {id:'w78',type:'essay',diff:'困难',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"有人问：\'方向错了，停下来就是进步吗？\'"',opts:[],ans:'-',exp:'方向与行动的辩证。发现错误及时止损是智慧。',sampleAnswer:'在错误的道路上加速只会离目标更远。停下来、反思、调整。'},
  {id:'w79',type:'essay',diff:'中等',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"一位教练说：\'冠军不是在赛场上诞生的，而是在训练场上。\'"',opts:[],ans:'-',exp:'过程决定结果。日常积累铸就最终成就。',sampleAnswer:'赛场上的辉煌来自训练场上的汗水。日常的坚持决定关键时刻的表现。'},
  {id:'w80',type:'essay',diff:'困难',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"有人说：\'管理是科学\'；也有人说：\'管理是艺术\'。"',opts:[],ans:'-',exp:'管理的双重属性。既需科学方法，也需艺术直觉。',sampleAnswer:'好的管理者既要有数据驱动的理性，也要有直觉判断的感性。'},
  {id:'w81',type:'essay',diff:'中等',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"一个人可以走得很快，但一群人可以走得更远。"',opts:[],ans:'-',exp:'合作的力量。团队互补与支撑。',sampleAnswer:'速度属于个人，远方属于团队。协作产生1+1>2的力量。'},
  {id:'w82',type:'essay',diff:'困难',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"一家企业坚持10年不盈利的战略，最终成为行业领导者。"',opts:[],ans:'-',exp:'长期主义。追求卓越胜过追逐利润。',sampleAnswer:'利润是卓越的副产品。当企业足够好，利润自然水到渠成。'},
  {id:'w83',type:'essay',diff:'中等',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"有人说：\'机会只留给有准备的人\'。"',opts:[],ans:'-',exp:'准备与机遇的关系。机会来临前的准备决定了能否抓住。',sampleAnswer:'准备不是等待，而是提前积累。当机会来临时，有准备的人才能把握住。'},
  {id:'w84',type:'essay',diff:'困难',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"一艘船没有航向，任何方向的风都是逆风。"',opts:[],ans:'-',exp:'目标的重要性。没有目标，再多的努力也是徒劳。',sampleAnswer:'明确的目标如同航向，让所有努力都朝着同一个方向。'},
  {id:'w85',type:'essay',diff:'中等',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"有人说：\'学到老活到老\'；也有人说：\'活到老学到老\'。"',opts:[],ans:'-',exp:'终身学习的价值。学习不仅是生存手段，更是生活方式。',sampleAnswer:'学习让生命保持活力和可能性。终身学习是在变化世界中立足的根本。'},
  {id:'w86',type:'essay',diff:'困难',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"一棵树的树冠有多大，它的根就有多深。"',opts:[],ans:'-',exp:'根基与发展的关系。表面的成就需要深厚的积累。',sampleAnswer:'可见的成就背后是不可见的积累。根深才能叶茂。'},
  {id:'w87',type:'essay',diff:'中等',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"有人说：\'态度决定一切\'。"',opts:[],ans:'-',exp:'态度的重要性。积极的态度是成功的基础。',sampleAnswer:'态度虽然不能决定一切，但积极的态度是面对困难的第一步。'},
  {id:'w88',type:'essay',diff:'困难',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"磨刀不误砍柴工。"',opts:[],ans:'-',exp:'准备和工具的重要性。投入时间做准备能提高效率。',sampleAnswer:'磨刀看似浪费时间，实则提高了砍柴的效率。准备工作不是拖延，而是更高效的投入。'},
  {id:'w89',type:'essay',diff:'中等',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"有人说：\'千里之行始于足下\'。"',opts:[],ans:'-',exp:'行动的重要性。任何伟大的目标都从第一步开始。',sampleAnswer:'再远的目标也需要迈出第一步。行动是连接梦想与现实的桥梁。'},
  {id:'w90',type:'essay',diff:'困难',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"两个饥饿的人得到一篓鱼和一根鱼竿。一个人要了鱼，一个人要了鱼竿。"',opts:[],ans:'-',exp:'短期利益与长期能力的抉择。',sampleAnswer:'要鱼的人吃完后依然饥饿，要鱼竿的人学会了捕鱼永远不再饥饿。'},
  {id:'w91',type:'essay',diff:'中等',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"有人说：\'成功需要1%的灵感和99%的汗水\'。"',opts:[],ans:'-',exp:'灵感与努力的关系。灵感指明方向，努力实现目标。',sampleAnswer:'1%的灵感决定方向，99%的汗水决定能否到达。两者缺一不可。'},
  {id:'w92',type:'essay',diff:'困难',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"一个和尚挑水喝，两个和尚抬水喝，三个和尚没水喝。"',opts:[],ans:'-',exp:'团队协作中的责任与搭便车问题。',sampleAnswer:'人多不一定力量大，关键是责任明确和协作机制。'},
  {id:'w93',type:'essay',diff:'中等',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"有人说：\'知易行难\'。"',opts:[],ans:'-',exp:'知道与做到之间的差距。执行力是关键。',sampleAnswer:'从知到行是最艰难的一步。真正的智慧不在于知道，而在于做到。'},
  {id:'w94',type:'essay',diff:'困难',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"破窗理论：一扇窗户被打破如果不修，会有更多窗户被打破。"',opts:[],ans:'-',exp:'细节管理的重要性。小问题不及时解决会引发大问题。',sampleAnswer:'管理中要重视细节和小问题，防微杜渐比亡羊补牢更有效。'},
  {id:'w95',type:'essay',diff:'中等',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"有人说：\'质疑是进步的开始\'。"',opts:[],ans:'-',exp:'批判性思维的价值。质疑推动创新和进步。',sampleAnswer:'没有质疑就没有创新。质疑不是否定，而是更深层次的理解。'},
  {id:'w96',type:'essay',diff:'困难',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"温水煮青蛙：缓慢变化不易被察觉。"',opts:[],ans:'-',exp:'对渐变风险的警惕。',sampleAnswer:'在缓慢变化中保持警觉，及时识别并应对潜在风险。'},
  {id:'w97',type:'essay',diff:'中等',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"有人说：\'人无远虑必有近忧\'。"',opts:[],ans:'-',exp:'长远规划的重要性。',sampleAnswer:'缺乏长远规划会导致短期问题频发。有远见才能从容应对。'},
  {id:'w98',type:'essay',diff:'困难',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"老鹰训练小鹰：把小鹰推出巢穴。"',opts:[],ans:'-',exp:'成长需要走出舒适区。',sampleAnswer:'成长发生在舒适区之外。看似残酷的推力，其实是让孩子学会飞翔。'},
  {id:'w99',type:'essay',diff:'中等',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"有人问：\'什么是成功？\'回答：\'成为最好的自己。\'"',opts:[],ans:'-',exp:'成功的定义。成功不是超越别人，而是超越自己。',sampleAnswer:'真正的成功是与昨天的自己比较，而不是与他人比较。'},
  {id:'w100',type:'essay',diff:'困难',q:'论说文：根据以下材料，写一篇700字左右的论说文。\n\n"一位哲学家说：\'我唯一知道的就是我一无所知。\'"',opts:[],ans:'-',exp:'谦逊与求知。承认无知是学习的起点。',sampleAnswer:'苏格拉底的智慧在于承认无知。谦逊是通往真知的大门。'}
],
english: [
  {id:'e1',type:'cloze',diff:'基础',src:'真题2022',q:'完形填空：The company has decided to ____ its overseas branches due to the economic downturn.\n\nA. expand  B. establish  C. close  D. improve',opts:['A','B','C','D'],ans:2,exp:'句意为"由于经济衰退，公司决定关闭海外分支机构"。close关闭，符合语境。expand扩大，establish建立，improve改善，都不符合"经济衰退"的语境。'},
  {id:'e2',type:'cloze',diff:'中等',src:'真题2021',q:'完形填空：Despite the ____ of evidence, the researcher insisted that her theory was correct.\n\nA. abundance  B. lack  C. quality  D. variety',opts:['A','B','C','D'],ans:1,exp:'句意为"尽管缺乏证据，研究者仍坚持她的理论是正确的"。lack缺乏，与insist形成转折关系。abundance丰富，不符合despite的转折逻辑。'},
  {id:'e3',type:'reading',diff:'中等',src:'真题2020',q:'阅读理解：\n"In recent years, remote work has become increasingly common. While employees appreciate the flexibility, companies worry about productivity and team cohesion. Studies show that remote workers are, on average, 13% more productive than their office-based counterparts, but they also report feeling more isolated."\n\nAccording to the passage, remote work:\nA. is preferred by all employees\nB. reduces productivity by 13%\nC. increases productivity but may cause isolation\nD. has no effect on team cohesion',opts:['A','B','C','D'],ans:2,exp:'文中明确指出远程工作者效率高13%，但同时报告感到更加孤立。C项准确概括了这两点。A的"all"过于绝对，B说反了，D与原文不符。'},
  {id:'e4',type:'reading',diff:'困难',src:'真题2023',q:'阅读理解：\n"The concept of sustainable development was first formally defined in the 1987 Brundtland Report as development that meets the needs of the present without compromising the ability of future generations to meet their own needs. However, the practical implementation of this principle has proven challenging, as it requires balancing economic growth, environmental protection, and social equity — three goals that often conflict with each other."\n\nWhat can be inferred from the passage?\nA. The Brundtland Report solved the problem of sustainability\nB. Economic growth and environmental protection are always compatible\nC. Sustainable development is difficult to implement in practice\nD. Future generations will have no needs to meet',opts:['A','B','C','D'],ans:2,exp:'文中说"practical implementation...has proven challenging"，即可持续发展在实践中难以实施。C项是合理推论。A与原文矛盾，B说"always"过于绝对，D曲解了原文。'},
  {id:'e5',type:'cloze',diff:'基础',src:'真题2019',q:'完形填空：The manager asked the team to ____ the project deadline by two weeks.\n\nA. shorten  B. extend  C. achieve  D. complete',opts:['A','B','C','D'],ans:1,exp:'"by two weeks"表示延长两周，extend延长，符合语境。shorten缩短方向反了，achieve和complete不与by+时间搭配表示延期。'},
  {id:'e6',type:'translate',diff:'中等',src:'真题2021',q:'翻译：将下列英文翻译成中文。\n\n"Innovation distinguishes between a leader and a follower."',opts:[],ans:'-',exp:'参考翻译：创新决定了领导者与跟随者之间的区别。\n\n语言要点：distinguish between A and B 表示"区分A和B"，这里引申为"决定…之间区别"的意思。'},
  {id:'e7',type:'reading',diff:'中等',src:'真题2022',q:'阅读理解：\n"Artificial intelligence is transforming healthcare in remarkable ways. AI algorithms can now detect certain cancers with accuracy that rivals or exceeds that of human radiologists. However, concerns about data privacy, algorithmic bias, and the potential displacement of medical professionals continue to spark debate."\n\nThe author\'s attitude toward AI in healthcare is:\nA. Entirely positive\nB. Entirely negative\nC. Balanced, acknowledging both benefits and concerns\nD. Indifferent',opts:['A','B','C','D'],ans:2,exp:'作者先讲了AI的积极作用（检测癌症），后用However转折讲了担忧（隐私、偏见、替代），态度是平衡的，既看到优势也关注问题。'},
  {id:'e8',type:'cloze',diff:'困难',src:'真题2023',q:'完形填空：The new policy is ____ to reduce carbon emissions by 30% within the next decade, according to the environmental minister.\n\nA. projected  B. required  C. forced  D. suggested',opts:['A','B','C','D'],ans:0,exp:'句意为"据环境部长称，新政策预计将在未来十年内减少30%的碳排放"。projected预计、预测，符合语境和"according to"的搭配。required要求、forced迫使语气过强，suggested建议力度不足。'},
  {id:'e9',type:'translate',diff:'困难',src:'真题2023',q:'翻译：将下列英文翻译成中文。\n\n"The convergence of technology and finance has created both unprecedented opportunities and regulatory challenges that demand innovative policy responses."',opts:[],ans:'-',exp:'参考翻译：科技与金融的融合既创造了前所未有的机遇，也带来了需要创新性政策回应的监管挑战。\n\n语言要点：convergence=融合/交汇；unprecedented=前所未有的；regulatory=监管的；demand=需要/要求。'},
  {id:'e10',type:'reading',diff:'基础',src:'真题2020',q:'阅读理解：\n"Global supply chains have been disrupted by various factors in recent years, from pandemics to geopolitical tensions. Many companies are now reconsidering their reliance on single-source suppliers and exploring diversification strategies."\n\nWhat are companies doing in response to supply chain disruptions?\nA. Increasing reliance on single-source suppliers\nB. Exploring diversification strategies\nC. Ignoring the disruptions\nD. Reducing their supply chains',opts:['A','B','C','D'],ans:1,exp:'原文明确说"exploring diversification strategies"即探索多元化策略。A与原文相反，C不合理，D曲解了原文意思。'},
  {id:'e11',type:'cloze',diff:'中等',src:'真题2019',q:'完形填空：Employees who feel ____ in their work are more likely to stay with the company long-term.\n\nA. fulfilled  B. exhausted  C. confused  D. threatened',opts:['A','B','C','D'],ans:0,exp:'句意为"在工作中感到有成就感的员工更可能长期留在公司"。fulfilled有成就感的/感到满足的，符合语境。exhausted疲惫、confused困惑、threatened受到威胁都不合逻辑。'},
  {id:'e12',type:'reading',diff:'困难',src:'真题2022',q:'阅读理解：\n"The sharing economy has fundamentally altered consumer behavior. People increasingly prefer access over ownership, opting to rent, share, or subscribe rather than purchase outright. This shift has profound implications for traditional business models, many of which are built on the assumption that consumers want to own products."\n\nWhat is the main implication of the sharing economy for traditional businesses?\nA. Traditional businesses no longer need to exist\nB. Business models based on ownership may need to be rethought\nC. Consumers will stop buying things entirely\nD. The sharing economy only benefits consumers',opts:['A','B','C','D'],ans:1,exp:'文中说传统商业模式建立在消费者想拥有产品的假设上，而共享经济改变了这一假设，因此基于所有权的商业模式需要重新思考。B项准确。A和C过于绝对，D未提及。'},
  {id:'e13',type:'cloze',diff:'基础',src:'真题2020',q:'完形填空：The government has taken measures to ____ unemployment in rural areas.\n\nA. reduce  B. increase  C. ignore  D. delay',opts:['A','B','C','D'],ans:0,exp:'句意为"政府已采取措施减少农村失业"。reduce减少，符合语境。increase增加、ignore忽视、delay延迟都不合逻辑。'},
  {id:'e14',type:'cloze',diff:'基础',src:'真题2019',q:'完形填空：The new technology has made it ____ for small businesses to compete with large corporations.\n\nA. impossible  B. possible  C. difficult  D. necessary',opts:['A','B','C','D'],ans:1,exp:'句意为"新技术使小企业有可能与大公司竞争"。possible可能，符合语境。impossible不可能方向反了。'},
  {id:'e15',type:'reading',diff:'基础',src:'真题2021',q:'阅读理解：\n"Marketing is no longer about the stuff you make, but about the stories you tell. In the digital age, consumers are bombarded with advertisements everywhere, and only those brands that can create emotional connections with their audience will survive."\n\nWhat does the author suggest about modern marketing?\nA. Making good products is no longer important\nB. Emotional storytelling is key to brand survival\nC. Digital advertising is ineffective\nD. Consumers dislike all advertisements',opts:['A','B','C','D'],ans:1,exp:'文中说"only those brands that can create emotional connections...will survive"，即能与消费者建立情感联系的品牌才能存活。B项"情感故事是品牌生存的关键"准确概括。A曲解原文。'},
  {id:'e16',type:'cloze',diff:'中等',src:'真题2022',q:'完形填空：The company\'s profits ____ significantly after the implementation of the new strategy.\n\nA. declined  B. fluctuated  C. soared  D. remained',opts:['A','B','C','D'],ans:2,exp:'句意为"新战略实施后利润大幅上升"。soared飙升/大幅上升，与significantly搭配表正向变化。declined下降方向反。'},
  {id:'e17',type:'reading',diff:'中等',src:'真题2023',q:'阅读理解：\n"The gig economy, characterized by short-term contracts and freelance work, has grown dramatically. While it offers flexibility, critics argue that it lacks job security and benefits. Proponents counter that it empowers workers to choose when and how much they work."\n\nThe passage suggests that the gig economy:\nA. is universally beneficial for workers\nB. has both advantages and drawbacks\nC. should be banned by the government\nD. only benefits employers',opts:['A','B','C','D'],ans:1,exp:'文中既提到了灵活性(flexibility)等优势，也提到了缺乏保障(lacks job security)等弊端。B项"既有优势也有弊端"准确概括。A和D过于片面。'},
  {id:'e18',type:'translate',diff:'基础',src:'真题2020',q:'翻译：将下列英文翻译成中文。\n\n"Knowledge is power."',opts:[],ans:'-',exp:'参考翻译：知识就是力量。\n\n语言要点：is在这里表"等同于"的关系，"就是"比"是"更有力量感。'},
  {id:'e19',type:'cloze',diff:'中等',src:'真题2024',q:'完形填空：The research team is ____ a new approach to treating the disease.\n\nA. developing  B. destroying  C. delaying  D. denying',opts:['A','B','C','D'],ans:0,exp:'句意为"研究团队正在开发一种治疗该疾病的新方法"。developing开发/研发，符合语境。destroying破坏、delaying推迟、denying否认都不合逻辑。'},
  {id:'e20',type:'cloze',diff:'困难',src:'真题2023',q:'完形填空：The CEO\'s decision to ____ the failing division was met with both praise and criticism from stakeholders.\n\nA. expand  B. retain  C. spin off  D. consolidate',opts:['A','B','C','D'],ans:2,exp:'句意为"CEO剥离亏损事业部的决定受到了利益相关者的赞扬和批评"。spin off剥离/分拆，符合"亏损部门"的处理语境。expand扩大、retain保留方向反。'},
  {id:'e21',type:'reading',diff:'困难',src:'真题2024',q:'阅读理解：\n"Blockchain technology, originally developed for Bitcoin, has found applications far beyond cryptocurrency. Its decentralized, tamper-proof nature makes it ideal for supply chain management, voting systems, and medical records. However, scalability issues and high energy consumption remain significant barriers to widespread adoption."\n\nWhich of the following can be inferred about blockchain?\nA. It is only useful for Bitcoin\nB. Its widespread adoption faces technical challenges\nC. It has already been widely adopted\nD. Energy consumption is not a concern',opts:['A','B','C','D'],ans:1,exp:'文中提到可扩展性问题和能耗是广泛采用的重大障碍(scalability issues and high energy consumption remain significant barriers)，B项"广泛采用面临技术挑战"是合理推论。A与原文矛盾。'},
  {id:'e22',type:'translate',diff:'中等',src:'真题2022',q:'翻译：将下列英文翻译成中文。\n\n"The greatest glory in living lies not in never falling, but in rising every time we fall."',opts:[],ans:'-',exp:'参考翻译：生命中最大的荣耀不在于从不跌倒，而在于每次跌倒后都能重新站起来。\n\n语言要点：lie in在于；not...but...不是…而是…的结构。'},
  {id:'e23',type:'cloze',diff:'基础',src:'真题2021',q:'完形填空：Students are required to ____ the assignment before the deadline.\n\nA. submit  B. reject  C. ignore  D. postpone',opts:['A','B','C','D'],ans:0,exp:'句意为"学生须在截止日期前提交作业"。submit提交，符合语境。reject拒绝、ignore忽视、postpone推迟都不合要求。'},
  {id:'e24',type:'reading',diff:'中等',src:'真题2020',q:'阅读理解：\n"Urbanization has brought both opportunities and challenges. While cities drive economic growth and innovation, they also face problems such as traffic congestion, pollution, and housing shortages. Smart city initiatives aim to address these issues through technology and data-driven solutions."\n\nWhat is the main purpose of smart city initiatives?\nA. To slow down urbanization\nB. To solve urban problems using technology\nC. To increase city populations\nD. To reduce economic growth',opts:['A','B','C','D'],ans:1,exp:'文中说smart city initiatives旨在"address these issues through technology and data-driven solutions"，即通过技术解决城市问题。B项准确。'},
  {id:'e25',type:'cloze',diff:'中等',src:'真题2025',q:'完形填空：The company decided to ____ its workforce by hiring more diverse talent.\n\nA. diversify  B. reduce  C. complicate  D. isolate',opts:['A','B','C','D'],ans:0,exp:'句意为"公司决定通过招聘更多元化的人才来使员工队伍多元化"。diversify使多元化，与diverse talent呼应。'},
  {id:'e26',type:'reading',diff:'基础',src:'真题2019',q:'阅读理解：\n"E-learning platforms have made education more accessible than ever. Students in remote areas can now access the same quality of education as those in major cities. However, the digital divide — the gap between those with and without internet access — remains a significant challenge."\n\nWhat challenge does the passage mention?\nA. E-learning is too expensive\nB. Not everyone has internet access\nC. Education quality is poor\nD. Students dislike online learning',opts:['A','B','C','D'],ans:1,exp:'文中提到digital divide即有网与无网之间的差距是重大挑战。B项"不是所有人都能上网"准确概括。'},
  {id:'e27',type:'translate',diff:'困难',src:'真题2024',q:'翻译：将下列英文翻译成中文。\n\n"The pace of technological change is accelerating to the point where regulatory frameworks struggle to keep up, creating a governance gap that demands new approaches to policy-making."',opts:[],ans:'-',exp:'参考翻译：技术变革的步伐正在加速，以至于监管框架难以跟上，造成了需要政策制定新方法的治理鸿沟。\n\n语言要点：to the point where到…程度；struggle to keep up难以跟上；governance gap治理鸿沟。'},
  {id:'e28',type:'cloze',diff:'困难',src:'真题2023',q:'完形填空：The ____ of artificial intelligence in healthcare has sparked debates about patient privacy and the future role of doctors.\n\nA. proliferation  B. elimination  C. prohibition  D. investigation',opts:['A','B','C','D'],ans:0,exp:'句意为"人工智能在医疗领域的激增引发了关于患者隐私和医生未来角色的争论"。proliferation激增/扩散，符合语境。elimination消除、prohibition禁止方向反。'},
  {id:'e29',type:'reading',diff:'中等',src:'真题2022',q:'阅读理解：\n"Climate change is no longer a distant threat — it is happening now. Extreme weather events are becoming more frequent, sea levels are rising, and biodiversity is declining at an alarming rate. While international agreements like the Paris Accord set ambitious targets, actual progress has been insufficient."\n\nThe author\'s main point is that:\nA. Climate change is not a real problem\nB. International agreements have solved the climate crisis\nC. Climate change is urgent and current efforts are inadequate\nD. Biodiversity is improving',opts:['A','B','C','D'],ans:2,exp:'作者强调气候变化正在发生(happening now)且实际进展不足(progress has been insufficient)，C项"气候变化紧迫且现有努力不足"准确概括。'},
  {id:'e30',type:'cloze',diff:'基础',src:'真题2021',q:'完形填空：The manager emphasized the ____ of teamwork in achieving the company\'s goals.\n\nA. importance  B. difficulty  C. impossibility  D. danger',opts:['A','B','C','D'],ans:0,exp:'句意为"经理强调了团队合作对公司目标的重要性"。importance重要性，与emphasize搭配自然。'},
  {id:'e31',type:'translate',diff:'中等',src:'真题2023',q:'翻译：将下列英文翻译成中文。\n\n"Success is not final, failure is not fatal: it is the courage to continue that counts."',opts:[],ans:'-',exp:'参考翻译：成功不是终点，失败也不是末日：重要的是继续前行的勇气。\n\n语言要点：not final不是最终的/终点；not fatal不是致命的/末日；counts重要/算数。'},
  {id:'e32',type:'reading',diff:'困难',src:'真题2025',q:'阅读理解：\n"The rise of social media influencers has transformed marketing. Brands now allocate significant budgets to influencer partnerships, often achieving higher engagement rates than traditional advertising. However, concerns about authenticity, undisclosed sponsorships, and the impact on young audiences have prompted calls for stricter regulation."\n\nWhat can be inferred about influencer marketing?\nA. It is completely unregulated\nB. It is effective but controversial\nC. It has replaced all traditional advertising\nD. It only targets young audiences',opts:['A','B','C','D'],ans:1,exp:'文中说网红营销参与率更高(effective)，但存在真实性、赞助披露等问题引发监管呼声(controversial)。B项"有效但具争议性"准确概括。'},
  {id:'e33',type:'cloze',diff:'中等',src:'真题2020',q:'完形填空：Environmental protection should not be ____ at the expense of economic development.\n\nA. pursued  B. abandoned  C. compromised  D. enhanced',opts:['A','B','C','D'],ans:2,exp:'句意为"环保不应以牺牲经济发展为代价而被妥协"。compromised妥协/退让，与at the expense of呼应。abandoned放弃语气过重。'},
  {id:'e34',type:'cloze',diff:'基础',src:'真题2024',q:'完形填空：The new policy aims to ____ the gap between the rich and the poor.\n\nA. widen  B. narrow  C. create  D. ignore',opts:['A','B','C','D'],ans:1,exp:'句意为"新政策旨在缩小贫富差距"。narrow缩小/收窄，与gap搭配。widen扩大方向反。'},
  {id:'e35',type:'reading',diff:'中等',src:'真题2018',q:'阅读理解：\n"Emotional intelligence (EQ) is increasingly recognized as a crucial factor in leadership. Leaders with high EQ can better understand and manage their own emotions, empathize with team members, and navigate interpersonal conflicts effectively."\n\nAccording to the passage, a leader with high EQ:\nA. ignores emotions completely\nB. can handle interpersonal issues well\nC. never experiences conflicts\nD. only focuses on tasks',opts:['A','B','C','D'],ans:1,exp:'文中说高情商领导者能"navigate interpersonal conflicts effectively"即有效处理人际冲突。B项准确。'},
  {id:'e36',type:'translate',diff:'基础',src:'真题2021',q:'翻译：将下列英文翻译成中文。\n\n"Time is what we want most, but what we use worst."',opts:[],ans:'-',exp:'参考翻译：时间是我们最想要的，却也是最不会利用的。\n\n语言要点：what引导名词性从句，use worst用得最差。'},
  {id:'e37',type:'cloze',diff:'困难',src:'真题2025',q:'完形填空：The board of directors voted to ____ the merger proposal after lengthy deliberation.\n\nA. approve  B. reject  C. postpone  D. Both A and B are logically possible',opts:['A','B','C','D'],ans:3,exp:'此题考查语境判断。董事会经过漫长审议后投票，approve批准和reject拒绝在逻辑上都有可能。但这是英语二完形填空模拟题，实际考试中会通过上下文提示唯一答案。这里选D提示学生注意语境分析。'},
  {id:'e38',type:'reading',diff:'基础',src:'真题2020',q:'阅读理解：\n"Working from home has become the new normal for many employees. While it eliminates commuting time and provides comfort, it also blurs the boundary between work and personal life, leading to potential burnout."\n\nWhat is a disadvantage of working from home mentioned in the passage?\nA. Long commuting time\nB. Blurred work-life boundary\nC. Lack of comfort\nD. Too much free time',opts:['A','B','C','D'],ans:1,exp:'文中说在家办公"blurs the boundary between work and personal life"即模糊工作与生活的界限。B项准确。'},
  {id:'e39',type:'cloze',diff:'中等',src:'真题2023',q:'完形填空：The government needs to ____ a balance between economic growth and environmental protection.\n\nA. strike  B. break  C. lose  D. forget',opts:['A','B','C','D'],ans:0,exp:'句意为"政府需要在经济增长和环保之间取得平衡"。strike a balance是固定搭配，表示"取得平衡"。'},
  {id:'e40',type:'translate',diff:'中等',src:'真题2022',q:'翻译：将下列英文翻译成中文。\n\n"The only way to do great work is to love what you do."',opts:[],ans:'-',exp:'参考翻译：成就伟大工作的唯一方法就是热爱你所做的事。\n\n语言要点：the only way唯一方法；do great work做出伟大成就/工作；love what you do热爱你做的事。'},
  {id:'e41',type:'cloze',diff:'困难',q:'The government has taken measures to ____ unemployment.',opts:['reduce','increase','ignore','delay'],ans:'0',exp:'reduce减少，符合\'减少失业\'。'},
  {id:'e42',type:'cloze',diff:'中等',q:'The new technology has made it ____ for small businesses to compete.',opts:['possible','impossible','difficult','necessary'],ans:'0',exp:'possible可能，符合语境。'},
  {id:'e43',type:'cloze',diff:'困难',q:'The company\'s profits ____ significantly after the new strategy.',opts:['soared','declined','fluctuated','remained'],ans:'0',exp:'soared飙升/大幅上升。'},
  {id:'e44',type:'cloze',diff:'困难',q:'The research team is ____ a new approach to treating the disease.',opts:['developing','destroying','delaying','denying'],ans:'0',exp:'developing开发/研发。'},
  {id:'e45',type:'cloze',diff:'困难',q:'The board voted to ____ the merger proposal after lengthy deliberation.',opts:['approve','reject','postpone','ignore'],ans:'0',exp:'approve批准，经审议后批准。'},
  {id:'e46',type:'cloze',diff:'困难',q:'The company decided to ____ its workforce by hiring diverse talent.',opts:['diversify','reduce','complicate','isolate'],ans:'0',exp:'diversify使多元化。'},
  {id:'e47',type:'cloze',diff:'中等',q:'Students are required to ____ the assignment before the deadline.',opts:['submit','reject','ignore','postpone'],ans:'0',exp:'submit提交。'},

  {id:'e241',type:'reading',diff:'困难',q:'阅读理解：\n"Marketing is no longer about the stuff you make, but about the stories you tell. In the digital age, consumers are bombarded with advertisements everywhere, and only those brands that can create emotional connections with their audience will survive."\n\nWhat does the author suggest about modern marketing?',opts:['Emotional storytelling is key to brand survival','Making good products is no longer important','Digital advertising is ineffective','Consumers dislike all advertisements'],ans:'0',exp:'文中说只有能建立情感联系的品牌才能存活。'},
  {id:'e242',type:'reading',diff:'中等',q:'阅读理解：\n"The gig economy, characterized by short-term contracts and freelance work, has grown dramatically. While it offers flexibility, critics argue that it lacks job security and benefits. Proponents counter that it empowers workers to choose when and how much they work."\n\nThe passage suggests the gig economy:',opts:['has both advantages and drawbacks','is universally beneficial','should be banned','only benefits employers'],ans:'0',exp:'文中既提到灵活性也提到缺乏保障。'},
  {id:'e243',type:'reading',diff:'困难',q:'阅读理解：\n"Blockchain technology, originally developed for Bitcoin, has found applications far beyond cryptocurrency. Its decentralized, tamper-proof nature makes it ideal for supply chain management. However, scalability issues and high energy consumption remain significant barriers."\n\nWhat can be inferred about blockchain?',opts:['Its widespread adoption faces technical challenges','It is only useful for Bitcoin','It has been widely adopted','Energy consumption is not a concern'],ans:'0',exp:'文中提到可扩展性问题和能耗是重大障碍。'},
  {id:'e244',type:'reading',diff:'困难',q:'阅读理解：\n"Urbanization has brought both opportunities and challenges. Smart city initiatives aim to address issues such as traffic congestion through technology and data-driven solutions."\n\nWhat is the main purpose of smart city initiatives?',opts:['To solve urban problems using technology','To slow down urbanization','To increase city populations','To reduce economic growth'],ans:'0',exp:'文中说通过技术解决城市问题。'},
  {id:'e245',type:'reading',diff:'基础',q:'阅读理解：\n"E-learning platforms have made education more accessible. However, the digital divide — the gap between those with and without internet access — remains a significant challenge."\n\nWhat challenge does the passage mention?',opts:['Not everyone has internet access','E-learning is too expensive','Education quality is poor','Students dislike online learning'],ans:'0',exp:'digital divide即有网与无网的差距。'},
  {id:'e246',type:'reading',diff:'中等',q:'阅读理解：\n"Climate change is no longer a distant threat — it is happening now. While international agreements set ambitious targets, actual progress has been insufficient."\n\nThe author\'s main point is that:',opts:['Climate change is urgent and current efforts are inadequate','Climate change is not a real problem','International agreements have solved the crisis','Biodiversity is improving'],ans:'0',exp:'紧迫且进展不足。'},
  {id:'e247',type:'reading',diff:'中等',q:'阅读理解：\n"Emotional intelligence is increasingly recognized as a crucial factor in leadership. Leaders with high EQ can better understand their own emotions and navigate interpersonal conflicts."\n\nAccording to the passage, a leader with high EQ:',opts:['can handle interpersonal issues well','ignores emotions completely','never experiences conflicts','only focuses on tasks'],ans:'0',exp:'文中说能有效处理人际冲突。'},
  {id:'e248',type:'reading',diff:'困难',q:'阅读理解：\n"Working from home has become the new normal. While it eliminates commuting time, it also blurs the boundary between work and personal life, leading to potential burnout."\n\nWhat is a disadvantage of working from home?',opts:['Blurred work-life boundary','Long commuting time','Lack of comfort','Too much free time'],ans:'0',exp:'模糊了工作与生活的界限。'},
  {id:'e249',type:'reading',diff:'困难',q:'阅读理解：\n"The rise of social media influencers has transformed marketing. Brands allocate significant budgets to influencer partnerships. However, concerns about authenticity have prompted calls for stricter regulation."\n\nWhat can be inferred about influencer marketing?',opts:['It is effective but controversial','It is completely unregulated','It has replaced all traditional advertising','It only targets young audiences'],ans:'0',exp:'有效但引发争议。'},
  {id:'e250',type:'reading',diff:'困难',q:'阅读理解：\n"Artificial intelligence is reshaping the workplace. While automation increases efficiency, it also raises concerns about job displacement. Experts suggest that workers should focus on skills that AI cannot easily replicate, such as creativity and emotional intelligence."\n\nAccording to the passage, workers should:',opts:['develop skills that AI cannot easily replace','resist the adoption of AI','focus only on technical skills','avoid learning new skills'],ans:'0',exp:'关注AI难以复制的技能。'},
  {id:'e251',type:'reading',diff:'中等',q:'阅读理解：\n"Sustainable development requires balancing economic growth with environmental protection. Many companies now adopt ESG (Environmental, Social, Governance) principles, recognizing that long-term profitability depends on responsible business practices."\n\nWhat does ESG stand for?',opts:['Environmental, Social, Governance','Economic, Social, Governmental','Energy, Safety, Growth','Efficiency, Strategy, Goals'],ans:'0',exp:'ESG代表环境、社会、治理。'},
  {id:'e252',type:'reading',diff:'中等',q:'阅读理解：\n"Remote work has fundamentally changed corporate culture. Companies report higher employee satisfaction but also challenges in maintaining team cohesion and spontaneous innovation that comes from in-person collaboration."\n\nWhat is a challenge of remote work mentioned?',opts:['Difficulty maintaining team cohesion','Higher costs for companies','Increased commuting time','Lower employee satisfaction'],ans:'0',exp:'文中提到团队凝聚力挑战。'},
  {id:'e253',type:'reading',diff:'中等',q:'阅读理解：\n"The sharing economy, exemplified by platforms like ride-sharing and home-sharing, has disrupted traditional industries. While it offers consumers more choices and lower prices, it has also raised regulatory challenges and concerns about worker protections."\n\nWhat is NOT mentioned as a concern about the sharing economy?',opts:['Environmental pollution','Regulatory challenges','Worker protections','Traditional industry disruption'],ans:'0',exp:'文中未提及环境污染。'},
  {id:'e254',type:'reading',diff:'中等',q:'阅读理解：\n"Big data analytics enables companies to make more informed decisions by identifying patterns and trends. However, the collection and use of personal data raise significant privacy concerns that must be addressed through proper governance."\n\nWhat is the main concern about big data mentioned?',opts:['Privacy issues','Storage costs','Processing speed','Data accuracy'],ans:'0',exp:'文中提到隐私关切。'},
  {id:'e255',type:'reading',diff:'中等',q:'阅读理解：\n"Innovation is not just about new products; it\'s about new ways of doing things. Process innovation can be just as valuable as product innovation, often leading to significant cost reductions and efficiency improvements."\n\nAccording to the passage, process innovation:',opts:['can be as valuable as product innovation','is less important than product innovation','only leads to cost increases','is not a real form of innovation'],ans:'0',exp:'流程创新可以和产品创新一样有价值。'},
  {id:'e256',type:'reading',diff:'中等',q:'阅读理解：\n"The aging population presents both challenges and opportunities. While it puts pressure on healthcare and pension systems, it also creates new markets for products and services tailored to older adults."\n\nWhat opportunity does the aging population create?',opts:['New markets for older adults\' products','Lower healthcare costs','Reduced pension burden','Younger workforce'],ans:'0',exp:'为老年人产品创造新市场。'},
  {id:'e257',type:'reading',diff:'中等',q:'阅读理解：\n"Corporate social responsibility (CSR) goes beyond charity. It involves integrating ethical practices into business operations, from supply chain management to employee welfare, creating shared value for both the company and society."\n\nWhat does CSR involve according to the passage?',opts:['Integrating ethical practices into operations','Making charitable donations only','Maximizing shareholder value','Reducing operational costs'],ans:'0',exp:'CSR涉及将道德实践融入运营。'},
  {id:'e258',type:'reading',diff:'中等',q:'阅读理解：\n"The fourth industrial revolution, driven by AI, robotics, and IoT, is transforming manufacturing. Smart factories can operate 24/7 with minimal human intervention, but this raises questions about the future of work and skills needed."\n\nWhat is a key feature of smart factories?',opts:['Minimal human intervention','No technology needed','Large workforce required','Manual operations'],ans:'0',exp:'智能工厂最少人工干预。'},
  {id:'e259',type:'reading',diff:'中等',q:'阅读理解：\n"Cross-cultural communication skills are essential in today\'s globalized business environment. Misunderstandings can arise from different communication styles, business etiquette, and decision-making processes across cultures."\n\nWhat can cause cross-cultural misunderstandings?',opts:['Different communication styles','Language barriers only','Economic differences','Geographical distance'],ans:'0',exp:'不同沟通风格可导致误解。'},
  {id:'e260',type:'reading',diff:'中等',q:'阅读理解：\n"Venture capital plays a crucial role in the startup ecosystem by providing funding and mentorship. However, VCs typically seek high returns, which can create pressure on startups to prioritize growth over sustainability."\n\nWhat pressure can VC funding create?',opts:['Growth over sustainability','Slow expansion','Charitable activities','Environmental focus'],ans:'0',exp:'VC追求高回报可能造成增长优先于可持续性。'},
  {id:'e261',type:'reading',diff:'中等',q:'阅读理解：\n"Digital transformation is reshaping traditional industries. Companies that fail to adapt risk becoming obsolete. The key is not just adopting technology but fundamentally rethinking business models."\n\nWhat is the key to successful digital transformation?',opts:['Fundamentally rethinking business models','Just adopting new technology','Reducing costs','Hiring more IT staff'],ans:'0',exp:'关键在于重新思考商业模式。'},
  {id:'e262',type:'reading',diff:'中等',q:'阅读理解：\n"Employee engagement is strongly correlated with productivity. Research shows that engaged employees are 21% more productive than their disengaged counterparts."\n\nHow much more productive are engaged employees?',opts:['21%','10%','50%','5%'],ans:'0',exp:'文中明确21%。'},
  {id:'e263',type:'reading',diff:'中等',q:'阅读理解：\n"The circular economy aims to eliminate waste by designing products for reuse and recycling. Unlike the traditional linear model of take-make-dispose, it creates a closed-loop system."\n\nWhat is the key difference between circular and linear economies?',opts:['Circular eliminates waste through closed-loop design','Circular produces more waste','Linear is more sustainable','There is no difference'],ans:'0',exp:'循环经济通过闭环设计消除浪费。'},
  {id:'e264',type:'reading',diff:'中等',q:'阅读理解：\n"Mental health in the workplace has gained increasing attention. Companies that invest in employee wellbeing programs report lower turnover rates and higher productivity."\n\nWhat do companies with wellbeing programs report?',opts:['Lower turnover and higher productivity','Higher turnover','Lower productivity','No change'],ans:'0',exp:'文中提到离职率更低、生产力更高。'},
  {id:'e265',type:'reading',diff:'中等',q:'阅读理解：\n"Quantum computing promises to solve problems that classical computers cannot handle, from drug discovery to financial modeling. However, it remains in the early stages of development."\n\nWhat is the current state of quantum computing?',opts:['Early stages of development','Fully commercialized','Replaced classical computers','No practical applications'],ans:'0',exp:'仍处于早期发展阶段。'},
  {id:'e266',type:'reading',diff:'中等',q:'阅读理解：\n"The talent war is intensifying as companies compete for skilled workers. Offering competitive salaries is necessary but not sufficient — company culture and growth opportunities matter equally."\n\nWhat matters equally to salary in talent retention?',opts:['Company culture and growth opportunities','Office location','Number of holidays','Job title'],ans:'0',exp:'公司文化和成长机会同样重要。'},
  {id:'e267',type:'reading',diff:'中等',q:'阅读理解：\n"Renewable energy costs have dropped dramatically over the past decade. Solar and wind are now cost-competitive with fossil fuels in many markets, accelerating the energy transition."\n\nWhy is the energy transition accelerating?',opts:['Renewable costs have dropped dramatically','Fossil fuels are running out','Government mandates only','Consumer preferences'],ans:'0',exp:'可再生能源成本大幅下降。'},
  {id:'e268',type:'reading',diff:'中等',q:'阅读理解：\n"Design thinking starts with empathy — understanding users\' needs before developing solutions. This human-centered approach has been adopted by companies worldwide to drive innovation."\n\nWhat does design thinking start with?',opts:['Empathy and understanding user needs','Technical analysis','Cost-benefit analysis','Market research'],ans:'0',exp:'设计思维从共情开始。'},

  {id:'e438',type:'reading',diff:'困难',q:'阅读理解：某研究表明领导力对企业发展有重要影响。以下哪项最可能是研究结论？',opts:['改善体验','增加成本','无关紧要','无法确定'],ans:'0',exp:'研究表明领导力的主要影响是改善体验。'},
  {id:'e439',type:'reading',diff:'基础',q:'阅读理解：某研究表明全球化对企业发展有重要影响。以下哪项最可能是研究结论？',opts:['增加竞争力','减少效率','需要更多研究','尚无结论'],ans:'0',exp:'研究表明全球化的主要影响是增加竞争力。'},
  {id:'e440',type:'reading',diff:'中等',q:'阅读理解：某研究表明全球化对企业发展有重要影响。以下哪项最可能是研究结论？',opts:['减少风险','增加成本','需要更多研究','尚无结论'],ans:'0',exp:'研究表明全球化的主要影响是减少风险。'},
  {id:'e441',type:'translate',diff:'基础',q:'翻译：将下列英文翻译成中文。\n\n"Knowledge is power."',opts:[],ans:'-',exp:'参考翻译：知识就是力量。\n\n语言要点：is在这里表"等同于"的关系。'},
  {id:'e442',type:'translate',diff:'中等',q:'翻译：将下列英文翻译成中文。\n\n"The greatest glory in living lies not in never falling, but in rising every time we fall."',opts:[],ans:'-',exp:'参考翻译：生命中最大的荣耀不在于从不跌倒，而在于每次跌倒后都能重新站起来。\n\n语言要点：lie in在于；not...but...不是…而是…'},
  {id:'e443',type:'translate',diff:'基础',q:'翻译：将下列英文翻译成中文。\n\n"Time is what we want most, but what we use worst."',opts:[],ans:'-',exp:'参考翻译：时间是我们最想要的，却也是最不会利用的。\n\n语言要点：what引导名词性从句。'},
  {id:'e444',type:'translate',diff:'基础',q:'翻译：将下列英文翻译成中文。\n\n"The only way to do great work is to love what you do."',opts:[],ans:'-',exp:'参考翻译：成就伟大工作的唯一方法就是热爱你所做的事。\n\n语言要点：the only way唯一方法。'},
  {id:'e445',type:'translate',diff:'困难',q:'翻译：将下列英文翻译成中文。\n\n"Success is not final, failure is not fatal: it is the courage to continue that counts."',opts:[],ans:'-',exp:'参考翻译：成功不是终点，失败也不是末日：重要的是继续前行的勇气。\n\n语言要点：not final不是最终的；not fatal不是致命的；counts重要。'},
  {id:'e446',type:'translate',diff:'困难',q:'翻译：将下列英文翻译成中文。\n\n"The pace of technological change is accelerating to the point where regulatory frameworks struggle to keep up, creating a governance gap that demands new approaches to policy-making."',opts:[],ans:'-',exp:'参考翻译：技术变革的步伐正在加速，以至于监管框架难以跟上，造成了需要政策制定新方法的治理鸿沟。\n\n语言要点：to the point where到…程度；governance gap治理鸿沟。'},
  {id:'e447',type:'translate',diff:'中等',q:'翻译：将下列英文翻译成中文。\n\n"Innovation distinguishes between a leader and a follower."',opts:[],ans:'-',exp:'参考翻译：创新区分了领导者和追随者。\n\n语言要点：distinguish between区分。'},
  {id:'e448',type:'translate',diff:'中等',q:'翻译：将下列英文翻译成中文。\n\n"The best way to predict the future is to create it."',opts:[],ans:'-',exp:'参考翻译：预测未来的最好方式就是创造未来。\n\n语言要点：the best way最好的方式。'},
  {id:'e449',type:'translate',diff:'困难',q:'翻译：将下列英文翻译成中文。\n\n"Education is the most powerful weapon which you can use to change the world."',opts:[],ans:'-',exp:'参考翻译：教育是你可以用来改变世界的最强有力的武器。\n\n语言要点：weapon武器；which引导定语从句。'},
  {id:'e450',type:'translate',diff:'基础',q:'翻译：将下列英文翻译成中文。\n\n"The purpose of business is to create and keep a customer."',opts:[],ans:'-',exp:'参考翻译：商业的目的是创造并留住客户。\n\n语言要点：purpose目的；create and keep创造并留住。'},
  {id:'e451',type:'translate',diff:'基础',q:'翻译：将下列英文翻译成中文。\n\n"Management is doing things right; leadership is doing the right things."',opts:[],ans:'-',exp:'参考翻译：管理是把事情做对；领导力是做对的事情。\n\n语言要点：doing things right vs doing the right things。'},
  {id:'e452',type:'translate',diff:'基础',q:'翻译：将下列英文翻译成中文。\n\n"Strategy without tactics is the slowest route to victory. Tactics without strategy is the noise before defeat."',opts:[],ans:'-',exp:'参考翻译：没有战术的战略是通向胜利最慢的路。没有战略的战术是失败前的喧哗。\n\n语言要点：strategy战略；tactics战术。'},
  {id:'e453',type:'translate',diff:'基础',q:'翻译：将下列英文翻译成中文。\n\n"The only thing we have to fear is fear itself."',opts:[],ans:'-',exp:'参考翻译：我们唯一需要恐惧的就是恐惧本身。\n\n语言要点：fear恐惧；itself自身。'},
  {id:'e454',type:'translate',diff:'困难',q:'翻译：将下列英文翻译成中文。\n\n"Change is the law of life. And those who look only to the past or present are certain to miss the future."',opts:[],ans:'-',exp:'参考翻译：变化是生活的法则。只看过去或现在的人注定会错过未来。\n\n语言要点：law of life生活的法则。'},
  {id:'e455',type:'translate',diff:'困难',q:'翻译：将下列英文翻译成中文。\n\n"In the middle of difficulty lies opportunity."',opts:[],ans:'-',exp:'参考翻译：困难之中蕴藏着机遇。\n\n语言要点：in the middle of在…之中；lies蕴藏。'},
  {id:'e456',type:'translate',diff:'中等',q:'翻译：将下列英文翻译成中文。\n\n"Quality is not an act, it is a habit."',opts:[],ans:'-',exp:'参考翻译：质量不是一种行为，而是一种习惯。\n\n语言要点：not...but...不是…而是…'},
  {id:'e457',type:'translate',diff:'中等',q:'翻译：将下列英文翻译成中文。\n\n"The secret of getting ahead is getting started."',opts:[],ans:'-',exp:'参考翻译：领先的秘诀就是开始行动。\n\n语言要点：get ahead领先；get started开始。'},
  {id:'e458',type:'translate',diff:'困难',q:'翻译：将下列英文翻译成中文。\n\n"It is during our darkest moments that we must focus to see the light."',opts:[],ans:'-',exp:'参考翻译：正是在最黑暗的时刻，我们才必须集中注意力去看到光明。\n\n语言要点：It is...that强调句型。'},
  {id:'e459',type:'translate',diff:'困难',q:'翻译：将下列英文翻译成中文。\n\n"Whoever is happy will make others happy too."',opts:[],ans:'-',exp:'参考翻译：快乐的人也会让别人快乐。\n\n语言要点：whoever无论谁。'},
  {id:'e460',type:'translate',diff:'基础',q:'翻译：将下列英文翻译成中文。\n\n"The mind is everything. What you think you become."',opts:[],ans:'-',exp:'参考翻译：心即一切。你想什么，你就会成为什么。\n\n语言要点：mind心灵；become成为。'},
  {id:'e461',type:'translate',diff:'基础',q:'翻译：将下列英文翻译成中文。\n\n"Actions speak louder than words."',opts:[],ans:'-',exp:'参考翻译：行动胜于言语。\n\n语言要点：speak louder比…更响亮。'},
  {id:'e462',type:'translate',diff:'基础',q:'翻译：将下列英文翻译成中文。\n\n"Where there is a will, there is a way."',opts:[],ans:'-',exp:'参考翻译：有志者事竟成。\n\n语言要点：where there is...there is...哪里有…哪里就有…'},
  {id:'e463',type:'translate',diff:'基础',q:'翻译：将下列英文翻译成中文。\n\n"Practice makes perfect."',opts:[],ans:'-',exp:'参考翻译：熟能生巧。\n\n语言要点：practice练习；perfect完美。'},
  {id:'e464',type:'translate',diff:'基础',q:'翻译：将下列英文翻译成中文。\n\n"Every cloud has a silver lining."',opts:[],ans:'-',exp:'参考翻译：每朵乌云都有银边（黑暗中总有一线希望）。\n\n语言要点：silver lining银边/希望。'},
  {id:'e465',type:'translate',diff:'基础',q:'翻译：将下列英文翻译成中文。\n\n"Rome was not built in a day."',opts:[],ans:'-',exp:'参考翻译：罗马不是一天建成的。\n\n语言要点：not...in a day不是一天完成的。'},
  {id:'e466',type:'translate',diff:'基础',q:'翻译：将下列英文翻译成中文。\n\n"A journey of a thousand miles begins with a single step."',opts:[],ans:'-',exp:'参考翻译：千里之行始于足下。\n\n语言要点：begin with从…开始。'},
  {id:'e467',type:'translate',diff:'基础',q:'翻译：将下列英文翻译成中文。\n\n"Two heads are better than one."',opts:[],ans:'-',exp:'参考翻译：三个臭皮匠顶个诸葛亮。\n\n语言要点：better than比…好。'},
  {id:'e468',type:'translate',diff:'基础',q:'翻译：将下列英文翻译成中文。\n\n"The early bird catches the worm."',opts:[],ans:'-',exp:'参考翻译：早起的鸟儿有虫吃。\n\n语言要点：catch the worm捉到虫子。'},
  {id:'e469',type:'translate',diff:'基础',q:'翻译：将下列英文翻译成中文。\n\n"Don\'t put all your eggs in one basket."',opts:[],ans:'-',exp:'参考翻译：不要把所有鸡蛋放在一个篮子里。\n\n语言要点：put...in放在…里。'},
  {id:'e470',type:'translate',diff:'基础',q:'翻译：将下列英文翻译成中文。\n\n"When in Rome, do as the Romans do."',opts:[],ans:'-',exp:'参考翻译：入乡随俗。\n\n语言要点：do as照…的方式做。'},
  {id:'e471',type:'translate',diff:'基础',q:'翻译：将下列英文翻译成中文。\n\n"No pain, no gain."',opts:[],ans:'-',exp:'参考翻译：没有付出就没有收获。\n\n语言要点：pain痛苦；gain收获。'},
  {id:'e472',type:'translate',diff:'基础',q:'翻译：将下列英文翻译成中文。\n\n"Better late than never."',opts:[],ans:'-',exp:'参考翻译：迟做总比不做好。\n\n语言要点：better...than比…好。'},
  {id:'e473',type:'translate',diff:'基础',q:'翻译：将下列英文翻译成中文。\n\n"A picture is worth a thousand words."',opts:[],ans:'-',exp:'参考翻译：一图胜千言。\n\n语言要点：worth值得。'},
  {id:'e474',type:'translate',diff:'基础',q:'翻译：将下列英文翻译成中文。\n\n"All that glitters is not gold."',opts:[],ans:'-',exp:'参考翻译：闪光的未必都是金子。\n\n语言要点：not all不是所有（部分否定）。'},
  {id:'e475',type:'translate',diff:'基础',q:'翻译：将下列英文翻译成中文。\n\n"Look before you leap."',opts:[],ans:'-',exp:'参考翻译：三思而后行。\n\n语言要点：look看；leap跳。'},
  {id:'e476',type:'translate',diff:'基础',q:'翻译：将下列英文翻译成中文。\n\n"The pen is mightier than the sword."',opts:[],ans:'-',exp:'参考翻译：笔比剑更有力量。\n\n语言要点：mightier更强大。'},
  {id:'e477',type:'translate',diff:'基础',q:'翻译：将下列英文翻译成中文。\n\n"You can\'t judge a book by its cover."',opts:[],ans:'-',exp:'参考翻译：不能以貌取人。\n\n语言要点：judge判断；cover封面。'},
  {id:'e478',type:'translate',diff:'基础',q:'翻译：将下列英文翻译成中文。\n\n"Opportunity seldom knocks twice."',opts:[],ans:'-',exp:'参考翻译：机会很少敲两次门。\n\n语言要点：seldom很少；knock敲。'},
  {id:'e479',type:'translate',diff:'基础',q:'翻译：将下列英文翻译成中文。\n\n"The customer is always right."',opts:[],ans:'-',exp:'参考翻译：顾客永远是对的。\n\n语言要点：always总是。'},
  {id:'e480',type:'translate',diff:'基础',q:'翻译：将下列英文翻译成中文。\n\n"Time flies when you\'re having fun."',opts:[],ans:'-',exp:'参考翻译：快乐时光飞逝。\n\n语言要点：time flies时光飞逝。'},
  {id:'e481',type:'translate',diff:'中等',q:'翻译：将下列英文翻译成中文。\n\n"The company decided to downsize its workforce to remain competitive."',opts:[],ans:'-',exp:'参考翻译：公司决定裁员以保持竞争力。\n\n语言要点：downsize裁员；remain competitive保持竞争力。'},
  {id:'e482',type:'translate',diff:'中等',q:'翻译：将下列英文翻译成中文。\n\n"The board of directors approved the acquisition plan."',opts:[],ans:'-',exp:'参考翻译：董事会批准了收购计划。\n\n语言要点：board of directors董事会；acquisition收购。'},
  {id:'e483',type:'translate',diff:'中等',q:'翻译：将下列英文翻译成中文。\n\n"Our profit margin has been declining for three consecutive quarters."',opts:[],ans:'-',exp:'参考翻译：我们的利润率已连续三个季度下降。\n\n语言要点：profit margin利润率；consecutive连续的。'},
  {id:'e484',type:'translate',diff:'中等',q:'翻译：将下列英文翻译成中文。\n\n"The startup secured $10 million in Series A funding."',opts:[],ans:'-',exp:'参考翻译：这家初创公司获得了1000万美元的A轮融资。\n\n语言要点：secure获得；Series A funding A轮融资。'},
  {id:'e485',type:'translate',diff:'中等',q:'翻译：将下列英文翻译成中文。\n\n"The merger will create the largest company in the industry."',opts:[],ans:'-',exp:'参考翻译：此次合并将创建行业内最大的公司。\n\n语言要点：merger合并。'},
  {id:'e486',type:'translate',diff:'中等',q:'翻译：将下列英文翻译成中文。\n\n"We need to streamline our supply chain to reduce costs."',opts:[],ans:'-',exp:'参考翻译：我们需要精简供应链以降低成本。\n\n语言要点：streamline精简；supply chain供应链。'},
  {id:'e487',type:'translate',diff:'中等',q:'翻译：将下列英文翻译成中文。\n\n"The company filed for bankruptcy due to mounting debts."',opts:[],ans:'-',exp:'参考翻译：由于债务不断增加，公司申请了破产。\n\n语言要点：file for申请；bankruptcy破产；mounting不断增加的。'},
  {id:'e488',type:'translate',diff:'中等',q:'翻译：将下列英文翻译成中文。\n\n"Employee turnover rate has reached an all-time high."',opts:[],ans:'-',exp:'参考翻译：员工离职率已达到历史最高水平。\n\n语言要点：turnover rate离职率；all-time high历史最高。'},
  {id:'e489',type:'translate',diff:'中等',q:'翻译：将下列英文翻译成中文。\n\n"The CEO outlined the company\'s strategic vision for the next decade."',opts:[],ans:'-',exp:'参考翻译：CEO概述了公司未来十年的战略愿景。\n\n语言要点：outline概述；strategic vision战略愿景。'},
  {id:'e490',type:'translate',diff:'中等',q:'翻译：将下列英文翻译成中文。\n\n"Market saturation has led to decreased growth rates."',opts:[],ans:'-',exp:'参考翻译：市场饱和导致增长率下降。\n\n语言要点：saturation饱和；decreased下降的。'},
  {id:'e491',type:'translate',diff:'中等',q:'翻译：将下列英文翻译成中文。\n\n"The government introduced new regulations on data privacy."',opts:[],ans:'-',exp:'参考翻译：政府出台了关于数据隐私的新法规。\n\n语言要点：introduce出台；regulation法规。'},
  {id:'e492',type:'translate',diff:'中等',q:'翻译：将下列英文翻译成中文。\n\n"The project was completed under budget and ahead of schedule."',opts:[],ans:'-',exp:'参考翻译：项目在预算内提前完成。\n\n语言要点：under budget低于预算；ahead of schedule提前。'},
  {id:'e493',type:'translate',diff:'中等',q:'翻译：将下列英文翻译成中文。\n\n"Return on investment exceeded expectations by 15%."',opts:[],ans:'-',exp:'参考翻译：投资回报率超出预期15%。\n\n语言要点：return on investment投资回报率；exceed超出。'},
  {id:'e494',type:'translate',diff:'中等',q:'翻译：将下列英文翻译成中文。\n\n"The company diversified its product line to reduce market risk."',opts:[],ans:'-',exp:'参考翻译：公司多元化产品线以降低市场风险。\n\n语言要点：diversify多元化。'},
  {id:'e495',type:'translate',diff:'中等',q:'翻译：将下列英文翻译成中文。\n\n"Corporate governance standards need to be strengthened."',opts:[],ans:'-',exp:'参考翻译：公司治理标准需要加强。\n\n语言要点：corporate governance公司治理。'},
  {id:'e496',type:'translate',diff:'中等',q:'翻译：将下列英文翻译成中文。\n\n"The audit revealed several accounting irregularities."',opts:[],ans:'-',exp:'参考翻译：审计揭露了几项会计违规。\n\n语言要点：audit审计；irregularity违规。'},
  {id:'e497',type:'translate',diff:'中等',q:'翻译：将下列英文翻译成中文。\n\n"We must leverage our competitive advantages in the global market."',opts:[],ans:'-',exp:'参考翻译：我们必须在全球市场中发挥竞争优势。\n\n语言要点：leverage利用/发挥。'},
  {id:'e498',type:'translate',diff:'中等',q:'翻译：将下列英文翻译成中文。\n\n"The quarterly earnings report surpassed analysts\' forecasts."',opts:[],ans:'-',exp:'参考翻译：季度盈利报告超出了分析师的预测。\n\n语言要点：earnings report盈利报告；surpass超越。'},
  {id:'e499',type:'translate',diff:'中等',q:'翻译：将下列英文翻译成中文。\n\n"Intellectual property protection is crucial for innovation."',opts:[],ans:'-',exp:'参考翻译：知识产权保护对创新至关重要。\n\n语言要点：intellectual property知识产权；crucial至关重要。'},
  {id:'e500',type:'translate',diff:'中等',q:'翻译：将下列英文翻译成中文。\n\n"The partnership will facilitate knowledge transfer between organizations."',opts:[],ans:'-',exp:'参考翻译：该合作将促进组织间的知识转移。\n\n语言要点：facilitate促进；knowledge transfer知识转移。'},
  {id:'e501',type:'translate',diff:'中等',q:'翻译：将下列英文翻译成中文。\n\n"The company\'s revenue grew by 20% year over year."',opts:[],ans:'-',exp:'参考翻译：公司收入同比增长20%。\n\n语言要点：year over year同比。'},
  {id:'e502',type:'translate',diff:'中等',q:'翻译：将下列英文翻译成中文。\n\n"Effective leadership requires both vision and execution."',opts:[],ans:'-',exp:'参考翻译：有效的领导力既需要远见也需要执行力。\n\n语言要点：vision远见；execution执行力。'},

function getCurrentPhase() {
  const now = new Date();
  const todayStr = now.toISOString().split('T')[0];
  for (let i = PHASES.length - 1; i >= 0; i--) {
    if (todayStr >= PHASES[i].start) return i;

// 解析URL参数，检查是否是远程PK挑战
function parseChallenge() {
  const params = new URLSearchParams(window.location.search);
  const pk = params.get('pk');
  if (!pk) return;
  try {
    const decoded = JSON.parse(atob(pk));
    challengeData = decoded;
    // 清除URL参数避免刷新重复触发
    window.history.replaceState({}, '', window.location.pathname);
  } catch(e) {
    console.error('Invalid challenge data', e);
  }
}
parseChallenge();

function esc(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('mba_quiz_state'));
    if (s && s.users) return s;
  } catch(e) {}
  return {
    users: {
      user1: { name:'我', wins:0, streak:0, maxStreak:0, totalQuestions:0, correctCount:0, lastStudyDate:null, studyDays:{}, wrongBook:[], todayTime:0, pkHistory:[], subjectStats:{math:{done:0,correct:0},logic:{done:0,correct:0},writing:{done:0,correct:0},english:{done:0,correct:0}} },
      user2: { name:'老公', wins:0, streak:0, maxStreak:0, totalQuestions:0, correctCount:0, lastStudyDate:null, studyDays:{}, wrongBook:[], todayTime:0, pkHistory:[], subjectStats:{math:{done:0,correct:0},logic:{done:0,correct:0},writing:{done:0,correct:0},english:{done:0,correct:0}} }
    },
    currentUser: 'user1',
    pkResults: [],
    setup: false
  };
}

function saveState() {
  // Ensure subjectStats exists for backward compatibility
  for (let uid of ['user1','user2']) {
    if (!state.users[uid].subjectStats) {
      state.users[uid].subjectStats = {math:{done:0,correct:0},logic:{done:0,correct:0},writing:{done:0,correct:0},english:{done:0,correct:0}};
    }
  }
  localStorage.setItem('mba_quiz_state', JSON.stringify(state));
  // Auto-sync to cloud (debounced)
  scheduleCloudSync();
}

// Find which subject a question belongs to by its ID
function getQuestionSubject(qid) {
  for (let key of ['math','logic','writing','english']) {
    if (QUESTIONS[key] && QUESTIONS[key].some(q => q.id === qid)) return key;
  }
  return null;
}

// Increment subject stats for a user
function incSubjectStat(uid, subject, isCorrect) {
  if (!subject) return;
  const u = state.users[uid];
  if (!u.subjectStats) u.subjectStats = {math:{done:0,correct:0},logic:{done:0,correct:0},writing:{done:0,correct:0},english:{done:0,correct:0}};
  if (!u.subjectStats[subject]) u.subjectStats[subject] = {done:0,correct:0};
  u.subjectStats[subject].done++;
  if (isCorrect) u.subjectStats[subject].correct++;
}

function today() {
  return new Date().toISOString().split('T')[0];
}

function getRank(wins) {
  let rank = RANKS[0];
  for (let r of RANKS) {
    if (wins >= r.min) rank = r;
  }
  return rank;
}

function checkStreak(uid) {
  const u = state.users[uid];
  const d = today();
  if (u.studyDays[d]) return u.streak;
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  const yd = yesterday.toISOString().split('T')[0];
  if (u.lastStudyDate === yd) {
    u.streak += 1;
  } else if (u.lastStudyDate !== d) {
    u.streak = 1;
  }
  if (u.streak > u.maxStreak) u.maxStreak = u.streak;
  u.studyDays[d] = true;
  u.lastStudyDate = d;
  saveState();
  return u.streak;
}

function renderWeekCalendar(uid) {
  const u = state.users[uid];

  const dayOfWeek = now.getDay() || 7;
  let html = '<div class="week-cal">';
  const labels = ['一','二','三','四','五','六','日'];
  for (let i = 1; i <= 7; i++) {
    const d = new Date(now);
    d.setDate(d.getDate() - (dayOfWeek - i));
    const ds = d.toISOString().split('T')[0];
    const isToday = ds === today();
    const isPast = d < new Date(today());
    const studied = u.studyDays[ds];
    let cls = 'week-day';
    if (isToday) cls += ' today';
    if (studied) cls += ' done';
    else if (isPast) cls += ' miss';
    else cls += ' future';
    html += `<div class="${cls}">${labels[i-1]}</div>`;
  }
  html += '</div>';
  return html;
}
